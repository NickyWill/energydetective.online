<style>
/* Layout: one calm phone-width column; each step is one screen; pink only for buttons and accents. */
:root{
  --bg:#FFF7F7; --paper:#FFFFFF; --ink:#141112; --muted:#5B5355; --line:#F3DADF;
  --pink:#FC889B; --pink-ink:#C2405A; --blush:#FBBECA; --sage:#A7B9A0; --deep:#E8536F;
  --display:"Playfair Display", Georgia, serif; --body:"Poppins", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100%;padding:28px max(20px, env(safe-area-inset-right, 0px)) 60px max(20px, env(safe-area-inset-left, 0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:34px} h2{font-size:27px} h3{font-size:20px}
p{margin:0}
h1:focus,h2:focus{outline:none}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}
.center{text-align:center}
.heart{width:34px;height:34px;display:block}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-family:var(--display);font-weight:800;font-size:20px}
.daypill{font-size:13px;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:14px 22px;background:var(--pink);color:var(--ink);font:600 17px var(--body);border:0;border-radius:14px;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:var(--paper);border:1.5px solid var(--ink)}
.btn.soft{background:var(--paper);border:1px solid var(--line);font-weight:500}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.link{background:none;border:0;padding:0;font:500 15px var(--body);color:var(--ink);text-decoration:underline;cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px}
.card.pink{background:var(--blush);border-color:transparent}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:500 16px var(--body);color:var(--ink);cursor:pointer;line-height:1.35}
.opt.on{border-color:var(--ink);background:var(--blush)}
.progress{display:flex;gap:6px;margin-bottom:20px}
.progress i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.progress i.on{background:var(--pink)}
input[type=text],input[type=password],input[type=number],textarea{width:100%;font:16px var(--body);padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--pink);border-color:var(--pink)}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;text-align:center}
.scorelab{text-align:center;color:var(--muted);margin-top:4px}
input[type=range]{width:100%;accent-color:var(--pink);height:32px}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px}
.row>*{flex:1}
/* journal */
.journal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.jday{background:var(--paper);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.jday b{font-size:11px;color:var(--muted);font-weight:600}
.jday.today{border-color:var(--pink)}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.dot{width:11px;height:11px;border-radius:50%;display:block}
.s1{background:var(--sage)}.s2{background:var(--blush)}.s3{background:var(--pink)}.s4{background:var(--deep)}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);justify-content:center}
.key span{display:inline-flex;align-items:center;gap:5px}
.reveal{border-left:0}
.reveal .eyebrow{color:var(--pink-ink)}
.big{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.2}
.big em{font-style:normal;color:var(--pink-ink)}
.stat{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--pink-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px}
.sect{display:flex;flex-direction:column;gap:10px}
.sect h3{margin-bottom:2px}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.list{margin:0;padding-left:20px}
.foot{margin-top:34px;text-align:center;font-size:12px;color:var(--muted)}
.dot.still{background:transparent!important;border:2px solid var(--pink)}
.ask{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.ask h2{font-size:26px}
/* report */
.rep{display:flex;flex-direction:column;gap:30px}
.cover{background:var(--ink);color:#fff;border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.cover .eyebrow{color:var(--blush)}
.cover h1{color:#fff;font-size:32px}
.chap{display:flex;flex-direction:column;gap:14px}
.chap .num{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-ink)}
.chap h2{font-size:26px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--pink-ink)}
.tile span{display:block;margin-top:6px;font-size:13px;line-height:1.35;color:var(--muted)}
.headline{background:var(--blush);border-radius:20px;padding:24px}
.headline p.big{font-size:25px}
.clue{background:var(--ink);color:#fff;border-radius:22px;padding:26px 24px;display:flex;flex-direction:column;gap:12px}
.clue .eyebrow{color:var(--blush)}
.clue .big{color:#fff;font-size:26px}
.clue .big em{color:var(--pink)}
.clue p{color:#F3E9EA}
.fromto{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.fromto .arrow{align-self:center}
.fromto .box{display:flex;flex-direction:column;justify-content:center}
.fromto .box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.fromto .box.to{background:var(--blush);border-color:transparent}
.fromto .box span{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fromto .arrow{font-size:22px;color:var(--pink-ink)}
details.notes summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
a.inl{color:var(--pink-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
@media print{ .stack:has(#share), .top, #saveopts, .toast{display:none !important} body{background:#fff} details.notes{display:block} }
.top .daypill{background:var(--blush)}
@media print{ #share, #redo, #saveopts, .top{display:none !important} details.notes{display:block} }
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--blush);border-radius:6px}
.bar.main span{font-weight:600}.bar.main i b{background:var(--pink)}
.scr{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:15px var(--body);color:var(--ink);cursor:pointer}
.scr b{font-weight:600}.scr span{color:var(--muted);font-size:14px;font-style:italic}
.scr:hover{border-color:var(--pink)}
.pts{display:flex;flex-direction:column;gap:8px}
.pt{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pt span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--pink-ink)}
.next{display:flex;flex-direction:column;gap:16px;text-align:center;padding:34px 6px 10px;border-top:1px solid var(--line);margin-top:6px}
.next h2{font-size:30px}
.next p{max-width:430px;margin:0 auto}
.next .lead{font-family:var(--display);font-style:italic;font-weight:600;font-size:21px;line-height:1.35}
.next .btn{max-width:430px;margin:6px auto 0}
.next .sign{color:var(--muted)}
.next .sign span{display:block;margin-top:4px;font-family:var(--display);font-style:italic;font-size:22px;color:var(--ink)}
details.sub summary{cursor:pointer;font-weight:600;color:var(--pink-ink)}
</style>

 peace:{name:"The Conflict Avoider", short:"You smooth things over to avoid a row.", night:"Why didn't I just say something?",

/* ===== STORAGE ===== */
var KEY = "yourLoveType.v1";
function blank(){ return {unlocked:false, answers:[], moments:[], ageNow:null, firstAge:null, who:null, needed:null, done:false}; }
function load(){ try { var raw = localStorage.getItem(KEY); return raw ? Object.assign(blank(), JSON.parse(raw)) : blank(); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ===== HELPERS ===== */
var app = document.getElementById("app");
function el(html){ app.innerHTML = html; window.scrollTo(0,0); var h = app.querySelector("h1,h2"); if (h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function heart(st){ return '<svg class="heart" aria-hidden="true"'+(st?' style="'+st+'"':'')+'><use href="#spotted"/></svg>'; }
function bind(sel, fn){ app.querySelectorAll(sel).forEach(function(b){ b.addEventListener("click", fn); }); }
function on(id, fn){ var x = document.getElementById(id); if (x) x.addEventListener("click", fn); }
function prog(n, of){ var s='<div class="progress" aria-hidden="true">'; for (var i=1;i<=of;i++) s+='<i class="'+(i<=n?'on':'')+'"></i>'; return s+'</div>'; }
function slug(t){ return t.toLowerCase().replace(/'/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function toast(t){ var x = document.createElement("div"); x.className="toast"; x.textContent=t; document.body.appendChild(x); setTimeout(function(){ x.remove(); }, 2200); }
function topBar(){ return '<div class="top"><span class="brand">Your Love Type</span>'+(PREVIEW?'<span class="daypill">Test mode</span>':'')+'</div>'; }

/* ===== SCORING ===== */
function scores(){
  var sc = {}, big = {}; ORDER.forEach(function(t){ sc[t]=0; big[t]=0; });
  QS.forEach(function(q,i){ var a = S.answers[i]; if (a!=null){ var v = q.rev ? 4-a : a; sc[q.t] += v; if (v===4) big[q.t]++; } });
  var ranked = ORDER.slice().sort(function(a,b){ return (sc[b]-sc[a]) || (big[b]-big[a]) || (ORDER.indexOf(a)-ORDER.indexOf(b)); });
  return {sc:sc, main:ranked[0], second:ranked[1]};
}

function gate(){

    '<button class="btn" id="go">Enter</button><p class="small muted">Version 3</p></div>');
  var pw = document.getElementById("pw");
  function tryIt(){ var v = pw.value.trim().toUpperCase(); if (v===TEST_PASSWORD){ S.unlocked=true; S.test=true; PREVIEW=true; save(); route(); } else if (v===PASSWORD){ S.unlocked=true; save(); route(); } else document.getElementById("err").hidden=false; }
  on("go", tryIt); pw.addEventListener("keydown", function(e){ if (e.key==="Enter") tryIt(); });
}

function intro(){
  el(topBar()+'<div class="stack">'+heart()+'<h1>What\'s your love type right now?</h1>'+
    '<p>Think about your relationship as it is today, not how it used to be or how you\'d like it to be. There are no right or wrong answers. Go with your first thought.</p>'+
    '<div class="card stack" style="gap:10px"><p><b>24 quick statements.</b> Tap how much you agree with each one.</p><p><b>Then 5 short questions</b> about when this feeling started.</p><p><b>Then your result:</b> your love type, why you react the way you do, and the tapping that helps most.</p><p class="small muted">It takes about 5 minutes. Everything stays private on this phone.</p></div>'+
    '<button class="btn" id="begin">Start</button>'+
    (PREVIEW ? testBox() : '')+'</div>');
  on("begin", function(){ q(0); });
  bindTest();
}

function testBox(){
  return '<div class="card stack" style="gap:10px;border:2px dashed var(--pink)"><p class="eyebrow" style="color:var(--pink-ink)">Test mode (only you see this)</p><p class="small">Jump straight to any love type\'s result:</p><div class="opts two">'+

}
function bindTest(){
  bind(".jump", function(){ var t = this.dataset.t, sec = ORDER[(ORDER.indexOf(t)+3)%8];
    S.answers = QS.map(function(x){ var v = x.t===t ? 4 : x.t===sec ? 3 : 1; return x.rev ? 4-v : v; });
    S.moments = ["When they go quiet","When I feel taken for granted"]; S.ageNow = 49; S.firstAge = 9; S.who = "Mum"; S.needed = "To be heard"; S.done = true; save(); result(); });
}

function q(i){
  if (i >= QS.length) return extra(1);
  var cur = S.answers[i];
  el(topBar()+prog(i+1, QS.length)+'<div class="stack"><p class="eyebrow">'+(i+1)+' of '+QS.length+'</p><h2>'+esc(QS[i].text)+'</h2>'+
    '<div class="opts">'+ANS.map(function(a,k){ return '<button class="opt'+(cur===k?' on':'')+'" data-v="'+k+'">'+a+'</button>'; }).join("")+'</div>'+
    (i>0 ? '<button class="link" id="bk" style="align-self:flex-start">Back</button>' : '')+'</div>');
  bind(".opt", function(){ S.answers[i] = +this.dataset.v; save(); q(i+1); });
  on("bk", function(){ q(i-1); });
}

function extra(n){
  var T = TYPES[scores().main], h = topBar()+prog(n,5)+'<div class="stack"><p class="eyebrow">Nearly there. '+n+' of 5</p>';
  function back(){ return '<button class="link" id="bk" style="align-self:flex-start">Back</button>'; }

    h += '<h2>Which moments get to you most?</h2><p class="muted">Optional. Choose any that fit.</p><div class="opts">'+MOMENTS.map(function(m){ return '<button class="opt'+(S.moments.indexOf(m)>=0?' on':'')+'" data-v="'+esc(m)+'">'+esc(m)+'</button>'; }).join("")+'</div><button class="btn" id="nx">Next</button>'+back()+'</div>';
    el(h); bind(".opt", function(){ var v=this.dataset.v, k=S.moments.indexOf(v); if (k>=0) S.moments.splice(k,1); else S.moments.push(v); this.classList.toggle("on"); save(); });

    on("bk", function(){ extra(n-1); });
  } else if (n===4){
    h += '<h2>'+(S.firstAge!=null ? 'Who were you with when you were '+S.firstAge+'?' : 'Who comes to mind when you think about where this feeling began?')+'</h2><p class="muted">The first person who comes to mind is enough.</p><div class="opts two">'+
      WHO.map(function(w){ return '<button class="opt'+(S.who===w?' on':'')+'" data-v="'+esc(w)+'">'+esc(w)+'</button>'; }).join("")+'</div>'+back()+'</div>';
    el(h); bind(".opt", function(){ S.who = this.dataset.v; save(); extra(5); }); on("bk", function(){ extra(3); });

    el(h); bind(".opt", function(){ S.needed = this.dataset.v; S.done = true; save(); result(); }); on("bk", function(){ extra(4); });
  }
}

function result(){
  var r = scores(), T = TYPES[r.main], T2 = TYPES[r.second];
  var age = S.firstAge, who = S.who && S.who!=="I don't remember" ? S.who : null;

  h += '<div class="chap"><p class="num">Your 3am thought</p><div class="headline"><p class="big">“'+esc(T.night)+'”</p></div><p class="muted">If this thought has ever kept you awake at night, you\'re not the only one. Here\'s why it happens.</p></div>';

  h += '<div class="chap"><p class="num">How it shows up</p><p>'+esc(T.shows)+'</p>'+
       '<div class="card stack" style="gap:8px"><p class="eyebrow">What sets it off</p><p>'+esc(T.sets)+'</p>'+(S.moments.length ? '<p class="muted small">You said these get to you most: '+esc(S.moments.map(function(m){ return m.replace(/^When /,"when "); }).join(", "))+'.</p>' : '')+'</div>'+

  h += '<div class="chap"><p class="num">Where it began</p><div class="clue"><p class="eyebrow">Case notes</p>';
  if (age!=null) h += '<p class="big">You first felt like this around age <em>'+age+'</em>'+(whoTxt ? ', with <em>'+esc(whoTxt)+'</em>' : '')+'.</p>';

  if (need) h += '<p>What you needed '+(age!=null?'at '+age:'back then')+', <b>'+esc(need)+'</b>, is often what you\'re still looking for in your relationship today.</p>';
  h += '<p>Think of it like an old file that never got cleared. When something today feels a bit like back then, that old file opens, and you feel all of it, not just what happened today.</p></div></div>';

  h += '<div class="chap"><p class="num">Your tapping</p><h2>Start with these in Love SOS</h2><p>When you feel it rising, reach for these two first.</p>'+
       T.scripts.map(function(s){ return '<a class="btn soft" href="'+esc(LOVE_SOS_LINK)+'?from=lovetype#'+slug(s)+'">'+esc(s)+'</a>'; }).join("")+
       '</div>';
  /* the script library: her 5 first, then all 40 by love type */
  h += '<div class="chap"><p class="num">Your tapping scripts</p><h2>Written for '+esc(T.name.replace(/^The /,"the "))+'</h2><p>These 5 scripts were written for exactly how you react right now. Start here.</p>'+
       SCRIPTS[r.main].map(function(sc){ return scriptCard(r.main, sc); }).join("")+howTo()+
       '</div>';

  if (VIDEO_LINK) h += '<div class="chap"><p class="num">A message from me</p><a class="btn ghost" href="'+esc(VIDEO_LINK)+'" target="_blank" rel="noopener">Watch: what your result means</a></div>';
  else if (PREVIEW) h += '<div class="card small muted" style="border:1.5px dashed var(--line)">Test mode: your overview video will go here once you send me the link.</div>';

  h += '<div class="chap"><p class="num">Your second love type</p><div class="card stack" style="gap:8px"><p class="big" style="font-size:22px">'+esc(T2.name)+'</p><p>'+esc(T2.short)+' You\'ll probably see a bit of both in you.</p>'+
       '<details class="sub"><summary>Your 5 '+esc(T2.name.replace(/^The /,""))+' scripts</summary><div class="stack" style="gap:10px;margin-top:12px">'+SCRIPTS[r.second].map(function(sc){ return scriptCard(r.second, sc); }).join("")+'</div></details></div></div>';

  var maxS = 12, ranked = ORDER.slice().sort(function(a,b){ return r.sc[b]-r.sc[a]; });
  h += '<div class="chap"><p class="num">How much of each love type is in you</p><p class="muted">Most women are a mix. The longer the bar, the more it shows up for you right now.</p><div class="bars">'+
    ranked.map(function(t){ var pc = Math.round(r.sc[t]/maxS*100); return '<div class="bar'+(t===r.main?' main':'')+'"><span>'+esc(TYPES[t].name.replace(/^The /,""))+'</span><i><b style="width:'+Math.max(pc,3)+'%"></b></i></div>'; }).join("")+'</div></div>';
  h += '<div class="next">'+heart('margin:0 auto')+'<p class="eyebrow" style="color:var(--pink-ink)">Your love type right now, not a label for life</p>'+
       '<h2>It doesn\'t have to be this way</h2>'+
       '<p>'+(age!=null ? 'Now we know where it started. Since you were '+age+', that feeling has been stored in your nervous system, and it\'s still running the show in your relationship today.' : 'Wherever it started, that feeling has been stored in your nervous system, and it\'s still running the show in your relationship today.')+'</p>'+
       '<p>In a Block Release Session, I find where those old emotions and beliefs are hiding and clear them. So the next time you\'re in a tricky situation, you\'re not reacting from '+(age!=null ? 'that <span style="white-space:nowrap">'+age+'-year-old</span> place' : 'that old place')+'.</p>'+
       '<p class="lead">Your reactions start to change. That\'s the important part of this work.</p>'+
       '<a class="btn" href="'+esc(BOOK_LINK)+'" target="_blank" rel="noopener">Book my Block Release Session</a>'+
       '<p class="sign">Sending lots of love,<br><span>Nicky xoxo</span></p></div>'+
       '<div class="stack" style="gap:10px"><button class="btn ghost" id="share">Save or send my result</button><div id="saveopts"></div></div>';
  h += '<div class="chap"><p class="num">Explore more tapping</p><h2>Explore more tapping to support your nervous system</h2><p class="muted">Every love type has its own 5 scripts. Most women are a mix, so use whichever fits the moment you\'re in.</p>'+
       ORDER.filter(function(t){ return t!==r.main && t!==r.second; }).map(function(t){ return '<details class="notes card"><summary>'+esc(TYPES[t].name)+'</summary><div class="stack" style="gap:10px;margin-top:12px">'+SCRIPTS[t].map(function(sc){ return scriptCard(t, sc); }).join("")+'</div></details>'; }).join("")+'</div>';
  h += '<details class="notes card"><summary>See all 8 love types</summary><div class="stack" style="gap:12px;margin-top:12px">'+ORDER.map(function(t){ return '<p><b>'+esc(TYPES[t].name)+'</b><br><span class="muted">'+esc(TYPES[t].short)+'</span></p>'; }).join("")+'</div></details>';
  h += '</div><div class="stack" style="margin-top:24px"><button class="link" id="redo" style="align-self:center">Take the quiz again</button></div>'+(PREVIEW?testBox():'');
  el(h);
  bind(".scr", function(){ player(this.dataset.t, +this.dataset.n, 0); });
  if (S.scrollTo){ var y = S.scrollTo; S.scrollTo = null; setTimeout(function(){ window.scrollTo(0, y); }, 30); }
  on("share", function(){ shareIt(T, T2, age, whoTxt, carried); });
  on("redo", function(){ var u=S.unlocked, t=S.test; S=blank(); S.unlocked=u; S.test=t; save(); intro(); });
  bindTest();
}

function scriptCard(t, sc){
  return '<button class="scr" data-t="'+t+'" data-n="'+sc.n+'"><b>'+esc(sc.title)+'</b><span>\u201c'+esc(sc.night.replace(/^"|"$/g,""))+'\u201d</span></button>';
}
function howTo(){
  return '<details class="notes card"><summary>Need a reminder of where to tap?</summary><div class="stack" style="gap:10px;margin-top:12px">'+
    (CHART_IMG ? '<img src="'+esc(CHART_IMG)+'" alt="The tapping points" style="border-radius:14px">' : (PREVIEW ? '<p class="small muted">Test mode: the tapping points picture will go here.</p>' : ''))+
    VIDEOS.map(function(v){ return '<a class="btn soft" href="'+esc(v.url)+'" target="_blank" rel="noopener">\u25B6 '+esc(v.label)+'</a>'; }).join("")+'</div></details>';
}
function findScript(t, n){ return SCRIPTS[t].filter(function(x){ return x.n===n; })[0]; }
function slider(id, v){ return '<div class="card"><div class="score" id="sc'+id+'">'+v+'</div><p class="scorelab" id="sl'+id+'">'+WORDS[v]+'</p><input type="range" id="rg'+id+'" min="0" max="10" value="'+v+'" aria-label="How strong it feels, 0 to 10"><div class="ends"><span>Calm</span><span>As strong as it gets</span></div></div>'; }
function bindSlider(id){ var rg = document.getElementById("rg"+id); rg.addEventListener("input", function(){ document.getElementById("sc"+id).textContent = rg.value; document.getElementById("sl"+id).textContent = WORDS[rg.value]; }); return rg; }

/* tap-along: 0 intro + rate, 1 setup, 2-4 rounds, 5 rate again */
var P = {};
function player(t, n, step){
  var sc = findScript(t, n), back = '<button class="link" id="out" style="align-self:flex-start">\u2190 Back to my result</button>';
  if (step===0){ P = {t:t, n:n, before:5}; S.scrollTo = window.scrollY; }
  var h = '<div class="top"><span class="brand">Tapping</span><span class="daypill">'+esc(TYPES[t].name.replace(/^The /,""))+'</span></div>'+prog(step+1, 6)+'<div class="stack">';
  if (step===0){
    h += '<h2>'+esc(sc.title)+'</h2><div class="card stack" style="gap:10px"><p class="eyebrow">Sound familiar?</p><p>'+esc(sc.entry)+'</p><p><i>'+esc(sc.night)+'</i></p></div>'+
      '<h3>How strong does it feel right now?</h3>'+slider("b", P.before)+
      '<button class="btn" id="nx">Start tapping</button>'+howTo()+'<p class="small muted">This isn\'t therapy. If you\'re struggling, please reach out for support. You can change any words that don\'t feel right for you.</p>'+back;
  } else if (step===1){
    h += '<p class="eyebrow">Getting started</p><h2>Tap the side of your hand</h2><p class="muted">Keep tapping the side of your hand and say each one out loud.</p><div class="stack" style="gap:10px">'+
      sc.setup.map(function(x){ return '<div class="card"><p>'+esc(x)+'</p></div>'; }).join("")+'</div><button class="btn" id="nx">Next: round 1</button>'+back;
  } else if (step>=2 && step<=4){
    var k = step-2;
    h += '<p class="eyebrow">Round '+(k+1)+' of 3</p><h2>'+ROUNDS[k]+'</h2><p class="muted">Tap each point about 7 times while you say the words.</p><div class="pts">'+
      sc.rounds[k].map(function(x){ return '<div class="pt"><span>'+POINTS[x[0]]+'</span><p>'+esc(x[1])+'</p></div>'; }).join("")+'</div>'+
      '<div class="card center" style="background:var(--blush);border:0"><p>Take a big, deep breath in, and let it go.</p></div><button class="btn" id="nx">'+(k<2 ? 'Next: round '+(k+2) : 'I\'ve finished')+'</button>'+back;
  } else if (step===5){
    h += '<h2>How strong does it feel now?</h2><p class="muted">You started at '+P.before+'.</p>'+slider("a", Math.min(P.before,5))+'<button class="btn" id="nx">Save</button>'+back;
  } else if (step===6){
    var drop = P.before - P.after;
    h += '<div class="center stack" style="gap:14px">'+heart('margin:0 auto')+'<h2>'+(drop>0 ? 'You went from '+P.before+' to '+P.after+'.' : 'Thank you for tapping.')+'</h2><p class="muted">'+
      (P.after<=5 ? (drop>0 ? 'That\'s you calming your nervous system and feeling safer in the moment.' : 'Some feelings need a few rounds. You can go again whenever you\'re ready.') : 'Some feelings need a few rounds. If you can, go through it again until you\'re at 5 or under.')+'</p></div>'+
      '<button class="btn'+(P.after>5?'':' ghost')+'" id="again">Tap through it again</button><button class="btn'+(P.after>5?' ghost':'')+'" id="out2">Back to my result</button>';
  }
  el(h+'</div>');
  if (step===0){ var rb = bindSlider("b"); on("nx", function(){ P.before = +rb.value; player(t, n, 1); }); }
  else if (step===5){ var ra = bindSlider("a"); on("nx", function(){ P.after = +ra.value; player(t, n, 6); }); }
  else if (step<5) on("nx", function(){ player(t, n, step+1); });
  on("again", function(){ player(t, n, 0); });
  on("out", result); on("out2", result);
}

function shareIt(T, T2, age, whoTxt, carried){
  var t = "My love type right now: "+T.name+"\n"+T.short+"\n\nMy 3am thought: “"+T.night+"”\n\nHow it shows up: "+T.shows+"\n\nWhat it's protecting: "+T.protects+
    (age!=null ? "\n\nI first felt like this around age "+age+(whoTxt?", with "+whoTxt:"")+"."+(carried?" That's "+carried+" years of carrying it.":"") : "")+
    "\n\nMy go-to Love SOS tapping: "+T.scripts.join(" and ")+".\nMy second love type: "+T2.name+".";
  function options(){
    document.getElementById("saveopts").innerHTML = '<div class="card stack" style="gap:10px"><a class="btn" href="mailto:?subject='+encodeURIComponent("My love type")+'&body='+encodeURIComponent(t)+'">Email it to myself</a><button class="btn ghost" id="pdf">Save as PDF or print</button><p class="small muted">Or take a screenshot.</p></div>';
    on("pdf", function(){ try { window.print(); } catch(e){} });
  }
  if (navigator.share){ navigator.share({title:"My love type", text:t}).catch(function(err){ if (!err || err.name!=="AbortError") options(); }); return; }
  options();
}

function route(){
  if (!S.unlocked) return gate();
  if (S.done) return result();
  var next = S.answers.length; if (next>0 && next<QS.length) return q(next);
  intro();
}
route();
</script>
