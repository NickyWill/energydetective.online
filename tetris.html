<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tetris — Energy Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a2420;
    --bg-deep:#121a17;
    --gold:#b89a6a;
    --sage:#a7b9a0;
    --sand:#d8cbb7;
    --ink:#e9e4da;
    --dim:rgba(233,228,218,.5);
    --hair:rgba(233,228,218,.14);
    --disp:'Instrument Serif',Georgia,serif;
    --sans:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden;max-width:100vw}
  body{
    font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;min-height:100vh;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;
    padding:clamp(14px,3vh,26px) 16px calc(clamp(14px,3vh,26px) + env(safe-area-inset-bottom));
    position:relative;
  }
  /* ambient ground: deep forest fog, faint radial life at center */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 20%, rgba(184,154,106,.05), transparent 55%),
      radial-gradient(140% 100% at 50% 100%, var(--bg-deep), var(--bg) 60%);
  }
  /* film grain, very quiet */
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .stage{position:relative;z-index:1;width:100%;max-width:920px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px)}

  header{text-align:center}
  .eyebrow{font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:color-mix(in oklch,var(--sage) 80%,var(--ink) 20%);margin:0 0 6px;opacity:.75}
  h1{font-family:var(--disp);font-weight:300;font-size:clamp(24px,4vw,34px);line-height:1;margin:0;letter-spacing:.01em}
  h1 i{font-style:italic;color:var(--gold)}

  .layout{display:flex;align-items:flex-start;justify-content:center;gap:clamp(18px,3.5vw,44px);width:100%}

  /* ---------- side panels: quiet captions, not a HUD ---------- */
  .panel{display:flex;flex-direction:column;gap:clamp(16px,3vh,26px);min-width:92px;padding-top:6px}
  .panel.right{align-items:flex-start}
  .panel.left{align-items:flex-end;text-align:right}
  .stat .lbl{display:block;font-size:9.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .stat .val{font-family:var(--disp);font-style:italic;font-weight:400;font-size:clamp(22px,3vw,28px);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .stat .val.accent{color:var(--gold)}
  .rule{width:26px;height:1px;background:var(--hair);margin:2px 0}
  .panel.left .rule{margin-left:auto}

  .next-wrap{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .next-wrap .lbl{font-size:9.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  #next{display:block}

  /* ---------- board ---------- */
  .board-wrap{position:relative;border-radius:3px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
  .board-wrap::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;
    box-shadow:inset 0 0 0 1px var(--hair), inset 0 40px 70px -30px rgba(0,0,0,.55), inset 0 -40px 70px -30px rgba(0,0,0,.55);
  }
  #board{display:block;background:transparent}

  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
    background:color-mix(in oklch,var(--bg-deep) 82%,transparent);opacity:0;pointer-events:none;transition:opacity .5s ease;text-align:center;padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay .ov-eyebrow{font-size:10px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--sage);opacity:.85}
  .overlay h2{font-family:var(--disp);font-weight:300;font-style:italic;font-size:clamp(26px,4.5vw,38px);margin:0;color:var(--ink)}
  .overlay .score-line{font-size:13px;color:var(--dim);letter-spacing:.04em}
  .overlay .score-line b{font-family:var(--disp);font-style:italic;color:var(--gold);font-size:18px;font-weight:400}
  .ov-btn{
    margin-top:6px;font-family:var(--sans);font-weight:500;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--bg-deep);background:var(--gold);border:none;border-radius:2px;padding:13px 30px;cursor:pointer;transition:filter .2s;
  }
  .ov-btn:hover,.ov-btn:focus-visible{filter:brightness(1.08)}
  .ov-btn:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
  .ov-hint{font-size:11px;color:var(--dim);letter-spacing:.05em;margin-top:2px}

  /* ---------- mobile touch controls ---------- */
  .controls{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:420px;margin-top:2px}
  .pad{display:flex;gap:10px}
  .pad.right{flex-direction:column;align-items:center;gap:8px}
  .tbtn{
    display:flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:50%;border:1px solid var(--hair);
    background:color-mix(in oklch,var(--ink) 6%,transparent);
    color:var(--ink);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation;
    transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent;
  }
  .tbtn:active{background:color-mix(in oklch,var(--gold) 22%,transparent);border-color:color-mix(in oklch,var(--gold) 50%,transparent)}
  .tbtn.rotate{width:64px;height:64px;font-size:22px}
  .tbtn.drop{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
  .tbtn svg{width:18px;height:18px}
  .pad.left{align-self:center}

  .kb-hint{font-size:11px;color:var(--dim);letter-spacing:.03em;text-align:center;margin-top:2px}
  @media(hover:hover) and (pointer:fine){ .controls{display:none} }
  @media(hover:none),(pointer:coarse){ .kb-hint{display:none} }

  @media(max-width:640px){
    .layout{gap:8px}
    .panel{min-width:56px}
    .stat .val{font-size:19px}
  }
  @media(max-width:520px){
    h1{font-size:22px}
    .stat .val{font-size:17px}
    .stat .lbl{font-size:8.5px;letter-spacing:.16em}
    .layout{gap:6px}
    .panel{min-width:48px}
    .next-wrap .lbl{font-size:8.5px}
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <p class="eyebrow">Energy Detective</p>
    <h1>Clear the <i>Lines</i></h1>
  </header>

  <div class="layout">
    <div class="panel left">
      <div class="stat"><span class="lbl">Score</span><span class="val accent" id="score">0</span></div>
      <div class="rule"></div>
      <div class="stat"><span class="lbl">Level</span><span class="val" id="level">1</span></div>
      <div class="rule"></div>
      <div class="stat"><span class="lbl">Lines</span><span class="val" id="lines">0</span></div>
    </div>

    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay" id="startOverlay">
        <p class="ov-eyebrow">Ready</p>
        <h2>Begin when you're ready</h2>
        <button class="ov-btn" id="startBtn">Start</button>
        <p class="ov-hint">Arrow keys to move · Up to rotate · Space to drop</p>
      </div>
      <div class="overlay" id="pauseOverlay">
        <p class="ov-eyebrow">Paused</p>
        <h2>Take a breath</h2>
        <button class="ov-btn" id="resumeBtn">Resume</button>
      </div>
      <div class="overlay" id="overOverlay">
        <p class="ov-eyebrow">The board filled</p>
        <h2>Game Over</h2>
        <p class="score-line">Score <b id="finalScore">0</b> · Best <b id="bestScore">0</b></p>
        <button class="ov-btn" id="retryBtn">Play Again</button>
      </div>
    </div>

    <div class="panel right">
      <div class="next-wrap">
        <span class="lbl">Next</span>
        <canvas id="next" width="100" height="100"></canvas>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="pad left">
      <button class="tbtn" id="btnLeft" aria-label="Move left">‹</button>
      <button class="tbtn" id="btnDown" aria-label="Soft drop">˅</button>
      <button class="tbtn" id="btnRight" aria-label="Move right">›</button>
    </div>
    <div class="pad right">
      <button class="tbtn rotate" id="btnRotate" aria-label="Rotate">↻</button>
      <button class="tbtn drop" id="btnHard" aria-label="Hard drop">Drop</button>
    </div>
  </div>
  <p class="kb-hint">← → move · ↑ rotate · ↓ soft drop · space hard drop · P pause</p>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  // BOARD GEOMETRY
  // ============================================================
  const COLS = 10, VISIBLE_ROWS = 20, HIDDEN_ROWS = 2, ROWS = VISIBLE_ROWS + HIDDEN_ROWS;
  let CELL = 28; // recomputed on resize

  // ============================================================
  // PIECES — each defined as cells inside an NxN box, rotated
  // 90° clockwise on demand via a matrix transform (no hardcoded
  // rotation states to keep this compact and correct).
  // Colours cycle through the three brand accents.
  // ============================================================
  const SHAPES = {
    I: { n:4, cells:[[1,0],[1,1],[1,2],[1,3]], color:'gold' },
    O: { n:2, cells:[[0,0],[0,1],[1,0],[1,1]], color:'sand' },
    T: { n:3, cells:[[0,1],[1,0],[1,1],[1,2]], color:'sage' },
    S: { n:3, cells:[[0,1],[0,2],[1,0],[1,1]], color:'gold' },
    Z: { n:3, cells:[[0,0],[0,1],[1,1],[1,2]], color:'sand' },
    J: { n:3, cells:[[0,0],[1,0],[1,1],[1,2]], color:'sage' },
    L: { n:3, cells:[[0,2],[1,0],[1,1],[1,2]], color:'gold' },
  };
  const COLOR_HEX = { gold:'#b89a6a', sage:'#a7b9a0', sand:'#d8cbb7' };

  function rotateCells(cells, n){
    // clockwise: (r,c) -> (c, n-1-r)
    return cells.map(([r,c]) => [c, n-1-r]);
  }

  // ============================================================
  // 7-BAG RANDOMISER — every piece appears once per shuffled bag,
  // so all seven show up at a fair, predictable rate.
  // ============================================================
  let bag = [];
  function refillBag(){
    bag = Object.keys(SHAPES);
    for(let i=bag.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [bag[i],bag[j]] = [bag[j],bag[i]];
    }
  }
  function nextType(){
    if(bag.length===0) refillBag();
    return bag.pop();
  }

  // ============================================================
  // GAME STATE
  // ============================================================
  let board, active, nextT, score, level, linesCleared, dropInterval, acc, lastT;
  let state = 'idle'; // idle | playing | paused | over
  let best = 0;
  try { best = +(localStorage.getItem('ed_tetris_best')||0) || 0; } catch(e){}

  function emptyBoard(){
    return Array.from({length:ROWS}, () => Array(COLS).fill(null));
  }

  function spawnPiece(type){
    const shape = SHAPES[type];
    return { type, n:shape.n, color:shape.color, cells:shape.cells.slice(), x: Math.floor((COLS - shape.n)/2), y: type==='I' ? 0 : (shape.n===2?0:0) };
  }

  function resetGame(){
    board = emptyBoard();
    refillBag();
    active = spawnPiece(nextType());
    nextT = nextType();
    score = 0; level = 1; linesCleared = 0;
    dropInterval = 1000;
    acc = 0; lastT = 0;
    updateHUD();
  }

  function collides(cells, n, x, y){
    for(const [r,c] of cells){
      const br = y+r, bc = x+c;
      if(bc<0 || bc>=COLS || br>=ROWS) return true;
      if(br>=0 && board[br][bc]) return true;
    }
    return false;
  }

  function tryMove(dx, dy){
    if(state!=='playing') return false;
    const nx = active.x+dx, ny = active.y+dy;
    if(!collides(active.cells, active.n, nx, ny)){
      active.x = nx; active.y = ny;
      return true;
    }
    return false;
  }

  function tryRotate(){
    if(state!=='playing') return;
    if(active.type==='O') return;
    const rotated = rotateCells(active.cells, active.n);
    const kicks = [0,-1,1,-2,2];
    for(const k of kicks){
      if(!collides(rotated, active.n, active.x+k, active.y)){
        active.cells = rotated; active.x += k;
        render();
        return;
      }
    }
  }

  function lockPiece(){
    for(const [r,c] of active.cells){
      const br = active.y+r, bc = active.x+c;
      if(br>=0) board[br][bc] = active.color;
    }
    const cleared = clearLines();
    if(cleared>0) applyScore(cleared);
    active = spawnPiece(nextT);
    nextT = nextType();
    if(collides(active.cells, active.n, active.x, active.y)){
      gameOver();
    }
  }

  function clearLines(){
    let cleared = 0;
    for(let r=ROWS-1;r>=0;r--){
      if(board[r].every(cell=>cell)){
        board.splice(r,1);
        board.unshift(Array(COLS).fill(null));
        cleared++; r++;
      }
    }
    return cleared;
  }

  function applyScore(n){
    const table = {1:100,2:300,3:500,4:800};
    score += (table[n]||800) * level;
    linesCleared += n;
    const newLevel = Math.floor(linesCleared/10)+1;
    if(newLevel!==level){
      level = newLevel;
      dropInterval = Math.max(110, 1000 - (level-1)*80);
    }
    updateHUD();
  }

  function updateHUD(){
    document.getElementById('score').textContent = score.toLocaleString();
    document.getElementById('level').textContent = level;
    document.getElementById('lines').textContent = linesCleared;
  }

  function hardDrop(){
    if(state!=='playing') return;
    let dist=0;
    while(!collides(active.cells, active.n, active.x, active.y+1)){ active.y++; dist++; }
    score += dist*2;
    lockPiece();
    updateHUD();
    render();
  }

  function tick(){
    if(!tryMove(0,1)){
      lockPiece();
    }
    render();
  }

  // ============================================================
  // RENDER — soft glowing translucent orbs, additive light on a
  // deep forest ground. Intensity (glow spread, ambient dimming,
  // orb closeness) rises as the stack nears the top.
  // ============================================================
  const boardCv = document.getElementById('board');
  const bctx = boardCv.getContext('2d');
  const nextCv = document.getElementById('next');
  const nctx = nextCv.getContext('2d');

  function fillFraction(){
    let highest = ROWS;
    for(let r=HIDDEN_ROWS;r<ROWS;r++){
      if(board[r].some(c=>c)){ highest = r; break; }
    }
    const usable = ROWS - HIDDEN_ROWS;
    const filled = Math.max(0, ROWS - highest - 1);
    return Math.min(1, filled/(usable*0.65));
  }

  function drawOrb(ctx, cx, cy, radius, colorKey, intensity, coreAlpha){
    const hex = COLOR_HEX[colorKey];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = hex;
    ctx.shadowBlur = 10 + intensity*16;
    const grad = ctx.createRadialGradient(cx-radius*0.25, cy-radius*0.3, radius*0.05, cx, cy, radius);
    grad.addColorStop(0, hexAlpha(hex, coreAlpha));
    grad.addColorStop(0.55, hexAlpha(hex, coreAlpha*0.55));
    grad.addColorStop(1, hexAlpha(hex, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function hexAlpha(hex, a){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function render(){
    const W = COLS*CELL, H = VISIBLE_ROWS*CELL;
    boardCv.width = W; boardCv.height = H;
    const intensity = fillFraction();

    // ground: deep fog, dimming further as the board fills
    bctx.clearRect(0,0,W,H);
    const bg = bctx.createRadialGradient(W/2, H*0.15, H*0.1, W/2, H*0.9, H*0.9);
    bg.addColorStop(0, `rgba(30,42,37,${0.9 - intensity*0.25})`);
    bg.addColorStop(1, `rgba(14,20,18,${0.96})`);
    bctx.fillStyle = bg;
    bctx.fillRect(0,0,W,H);

    // faint grid, barely there
    bctx.strokeStyle = 'rgba(233,228,218,0.035)';
    bctx.lineWidth = 1;
    for(let c=1;c<COLS;c++){ bctx.beginPath(); bctx.moveTo(c*CELL+.5,0); bctx.lineTo(c*CELL+.5,H); bctx.stroke(); }
    for(let r=1;r<VISIBLE_ROWS;r++){ bctx.beginPath(); bctx.moveTo(0,r*CELL+.5); bctx.lineTo(W,r*CELL+.5); bctx.stroke(); }

    // orb radius grows slightly (sit closer together) as danger rises
    const radius = CELL*(0.36 + intensity*0.09);
    const coreAlpha = 0.5 + intensity*0.15;

    // locked cells
    for(let r=HIDDEN_ROWS;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const cell = board[r][c];
        if(cell){
          const cx = c*CELL+CELL/2, cy = (r-HIDDEN_ROWS)*CELL+CELL/2;
          drawOrb(bctx, cx, cy, radius, cell, intensity, coreAlpha);
        }
      }
    }
    // active piece + ghost
    if(active){
      let ghostY = active.y;
      while(!collides(active.cells, active.n, active.x, ghostY+1)) ghostY++;
      for(const [r,c] of active.cells){
        const gr = ghostY+r;
        if(gr>=HIDDEN_ROWS){
          const cx = (active.x+c)*CELL+CELL/2, cy=(gr-HIDDEN_ROWS)*CELL+CELL/2;
          bctx.save();
          bctx.globalAlpha = 0.16;
          bctx.fillStyle = COLOR_HEX[active.color];
          bctx.beginPath(); bctx.arc(cx,cy,radius*0.7,0,Math.PI*2); bctx.fill();
          bctx.restore();
        }
      }
      for(const [r,c] of active.cells){
        const br = active.y+r;
        if(br>=HIDDEN_ROWS){
          const cx=(active.x+c)*CELL+CELL/2, cy=(br-HIDDEN_ROWS)*CELL+CELL/2;
          drawOrb(bctx, cx, cy, radius, active.color, intensity, coreAlpha+0.15);
        }
      }
    }

    // vignette that deepens with danger
    const vg = bctx.createRadialGradient(W/2,H/2, H*0.25, W/2,H/2, H*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(8,12,10,${0.35+intensity*0.35})`);
    bctx.fillStyle = vg;
    bctx.fillRect(0,0,W,H);

    renderNext();
  }

  function renderNext(){
    const shape = SHAPES[nextT];
    const size = 90, cell = size/4;
    nextCv.width = size; nextCv.height = size;
    nctx.clearRect(0,0,size,size);
    const minR = Math.min(...shape.cells.map(c=>c[0])), maxR = Math.max(...shape.cells.map(c=>c[0]));
    const minC = Math.min(...shape.cells.map(c=>c[1])), maxC = Math.max(...shape.cells.map(c=>c[1]));
    const w = (maxC-minC+1), h = (maxR-minR+1);
    const offX = (4-w)/2 - minC, offY = (4-h)/2 - minR;
    for(const [r,c] of shape.cells){
      drawOrb(nctx, (c+offX)*cell+cell/2, (r+offY)*cell+cell/2, cell*0.4, shape.color, 0, 0.6);
    }
  }

  // ============================================================
  // SIZING
  // ============================================================
  function resize(){
    const wrap = document.querySelector('.board-wrap');
    const availH = window.innerHeight * 0.62;
    const availW = Math.min(window.innerWidth*0.66, 420);
    CELL = Math.floor(Math.min(availH/VISIBLE_ROWS, availW/COLS));
    CELL = Math.max(16, CELL);
    boardCv.style.width = (COLS*CELL)+'px';
    boardCv.style.height = (VISIBLE_ROWS*CELL)+'px';
    render();
  }

  // ============================================================
  // LOOP
  // ============================================================
  function loop(t){
    if(state==='playing'){
      if(!lastT) lastT=t;
      const dt = t-lastT; lastT=t;
      acc += dt;
      if(acc>=dropInterval){ acc=0; tick(); }
    } else {
      lastT = 0;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ============================================================
  // GAME FLOW
  // ============================================================
  const startOv = document.getElementById('startOverlay');
  const pauseOv = document.getElementById('pauseOverlay');
  const overOv  = document.getElementById('overOverlay');

  function showOverlay(el){ [startOv,pauseOv,overOv].forEach(o=>o.classList.remove('show')); if(el) el.classList.add('show'); }

  function startGame(){
    resetGame();
    state='playing';
    showOverlay(null);
    render();
  }
  function pauseGame(){
    if(state!=='playing') return;
    state='paused';
    showOverlay(pauseOv);
  }
  function resumeGame(){
    if(state!=='paused') return;
    state='playing'; lastT=0;
    showOverlay(null);
  }
  function gameOver(){
    state='over';
    if(score>best){ best=score; try{localStorage.setItem('ed_tetris_best', String(best));}catch(e){} }
    document.getElementById('finalScore').textContent = score.toLocaleString();
    document.getElementById('bestScore').textContent = best.toLocaleString();
    showOverlay(overOv);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  // ============================================================
  // INPUT — keyboard
  // ============================================================
  window.addEventListener('keydown', e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space',' '].includes(e.key) || e.code==='Space'){
      e.preventDefault();
    }
    if(e.key==='p'||e.key==='P'||e.key==='Escape'){
      if(state==='playing') pauseGame(); else if(state==='paused') resumeGame();
      return;
    }
    if(state==='idle' && (e.key==='Enter'||e.code==='Space')){ startGame(); return; }
    if(state==='over' && (e.key==='Enter'||e.code==='Space')){ startGame(); return; }
    if(state!=='playing') return;
    switch(e.key){
      case 'ArrowLeft': tryMove(-1,0); render(); break;
      case 'ArrowRight': tryMove(1,0); render(); break;
      case 'ArrowDown': if(tryMove(0,1)){ score++; updateHUD(); } render(); break;
      case 'ArrowUp': tryRotate(); break;
      case ' ': case 'Space': hardDrop(); break;
    }
  });
  document.getElementById('overOverlay').tabIndex=-1;

  // ============================================================
  // INPUT — touch buttons
  // ============================================================
  function bindHold(el, fn, repeat){
    let iv=null;
    const start=(ev)=>{ ev.preventDefault(); fn(); if(repeat){ iv=setInterval(fn, 130); } };
    const end=()=>{ if(iv){clearInterval(iv); iv=null;} };
    el.addEventListener('touchstart', start, {passive:false});
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    el.addEventListener('mousedown', start);
    window.addEventListener('mouseup', end);
  }
  bindHold(document.getElementById('btnLeft'), ()=>{tryMove(-1,0);render();}, true);
  bindHold(document.getElementById('btnRight'), ()=>{tryMove(1,0);render();}, true);
  bindHold(document.getElementById('btnDown'), ()=>{ if(tryMove(0,1)){score++;updateHUD();} render(); }, true);
  bindHold(document.getElementById('btnRotate'), ()=>{tryRotate();}, false);
  bindHold(document.getElementById('btnHard'), ()=>{hardDrop();}, false);

  // pause when tab hidden, to avoid a pile of drops on return
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pauseGame(); });

  resetGame();
  window.addEventListener('resize', resize);
  resize();
  render();
  showOverlay(startOv);
})();
</script>
</body>
</html>
