  /* Welcome to the Love SOS Kit */
  var WELCOME_HTML =
    '<h1 tabindex="-1">Welcome to the Love SOS Kit</h1>' +
    '<p class="ls-lead">Relationships matter. And because they matter, they can stir up some of our strongest feelings.</p>' +
    '<p style="margin-top:22px">Even in a loving, long-standing relationship, there are moments when things feel hard. You might feel triggered, rejected, resentful, guarded, or unsure how to say what you really feel. You might react in ways you don’t recognise, or hold things in to keep the peace.</p>' +
    '<p>None of this means your relationship is broken. It means you’re human.</p>' +
    '<p>Love SOS is for those moments. It isn’t about fixing your partner, analysing your relationship or being perfect. It’s about helping you calm down, feel steady and stay yourself when things feel intense.</p>' +
    '<h2>How it helps</h2>' +
    '<p style="margin-top:12px">EFT, often called tapping, is a gentle way to calm big feelings in the moment. You tap on points on your face and body while saying words that match how you feel. This tells your nervous system you’re safe, so the feeling settles and you can respond with more clarity and choice.</p>' +
    '<h2>What’s inside</h2>' +
    '<ul>' +
      '<li>10 tapping scripts for the feelings that show up in real relationships:<ul>' +
        '<li>feeling triggered or flooded</li><li>feeling rejected, dismissed or misunderstood</li><li>fear of fallout if you speak up</li>' +
        '<li>resentment that quietly builds</li><li>struggling to find your voice</li><li>blame and standoffs</li>' +
        '<li>when everything feels negative or heavy</li><li>wanting to soften and express love</li><li>feeling guarded or closed after hurt</li>' +
        '<li>feeling like you’ve lost yourself</li></ul></li>' +
      '<li>The Emergency Emotional Reset, for when it’s all too much and you just need to calm down enough to think clearly</li>' +
      '<li>3 short videos showing you how</li>' +
      '<li>The Relationship Wheel of Life, to see which parts of your relationship need the most care and which script to start with</li>' +
    '</ul>' +
    '<h2>How to use it</h2>' +
    '<ol>' +
      '<li>Pick the script that matches how you feel right now. There’s no right order.</li>' +
      '<li>Rate how strong it feels, from 0 to 10.</li>' +
      '<li>Follow the tapping, one round at a time, with a breath in between.</li>' +
      '<li>Rate it again. If you’re still above a 3, go again.</li>' +
    '</ol>' +
    '<p style="margin-top:14px">If the words don’t quite fit, change them to match what you feel. The tapping still works.</p>' +
    '<h2>A gentle note</h2>' +
    '<p style="margin-top:12px">As things settle, you may notice some feelings keep coming back, or go deeper than this one moment. That isn’t failure. It’s you getting to know yourself better. For now, your only job is to use these tools gently, without forcing anything to change.</p>' +
    '<p>The steadier you feel inside, the more clearly you can see what’s true for you.</p>' +
    '<p>I’m Nicky, an energy practitioner and a certified EFT Practitioner with EFT International. I’ve helped clients clear over 56,000 emotions, the kind that keep the same reactions and arguments coming back. I created this kit to give you a safe, gentle way to calm things down in the moment.</p>' +
    '<p>Take your time. Use what helps. Come back whenever you need to.</p>' +
    '<p class="ls-sign">Nicky xoxo</p>';

      '<div class="ls-stack"><button type="button" class="ls-btn" data-go="#/">Back to home</button></div>'
    );
  }

  /* Chart */
  function renderChart() {
    show(
      heart() +
      '<h1 tabindex="-1">Tapping Points</h1>' +
      pictureHTML(null) +
      '<div class="ls-stack"><button type="button" class="ls-btn" data-go="#/">Back to home</button></div>'
    );
  }

  /* Wheel */
  function renderWheel() {
    top.hidden = false;
    sosMini.hidden = false;
    app.hidden = true;
    app.innerHTML = "";
    rw.hidden = false;
    var h = rw.querySelector("h1, h2");
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
    toTop();
  }

  /* ---------- A tapping script, one screen at a time ---------- */
  var run = null;
  var wantCards = false;

  function startScript(s) {
    run = { s: s, step: "intro", before: 5, after: null, start: null, round: 0, point: 0 };
    renderStep();
  }

  function sliderHTML(v) {
    return '<div class="ls-value" id="ls-val" aria-hidden="true">' + v + "</div>" +
      '<p class="ls-feel" id="ls-feel" aria-hidden="true">' + esc(feelWord(v)) + "</p>" +
      '<div class="ls-slider"><div class="ls-track"></div><div class="ls-fill" id="ls-fill"></div>' +
      '<input class="ls-range" type="range" id="ls-range" min="0" max="10" step="1" value="' + v +
        '" aria-labelledby="ls-rate-h" aria-valuetext="' + v + ' out of 10"></div>' +
      '<div class="ls-ends" aria-hidden="true"><span><b>0</b>' + esc(RATE_LOW) + "</span><span><b>10</b>" + esc(RATE_HIGH) + "</span></div>";
  }
  function bindSlider(onChange) {
    var range = document.getElementById("ls-range");
    var val = document.getElementById("ls-val");
    var fill = document.getElementById("ls-fill");
    function sync() {
      var n = parseInt(range.value, 10);
      val.textContent = n;
      document.getElementById("ls-feel").textContent = feelWord(n);
      // keep the fill under the centre of the thumb
      fill.style.width = "calc(" + n * 10 + "% + " + (18 - n * 3.6).toFixed(1) + "px)";
      range.setAttribute("aria-valuetext", n + " out of 10, " + feelWord(n));
      onChange(n);
    }
    range.addEventListener("input", sync);
    range.addEventListener("change", sync);
    sync();
  }
  function navHTML(nextLabel, backId) {
    return '<div class="ls-nav">' +
      (backId ? '<button type="button" class="ls-btn ls-ghost" id="' + backId + '">Back</button>' : "") +
      '<button type="button" class="ls-btn" id="ls-next">' + esc(nextLabel) + "</button></div>";
  }

  function renderStep() {
    var r = run, s = r.s, isReset = s.id === "sos";
    var opts = { noSos: isReset };

    if (r.step === "intro") {
      var extra = "";
      [[H_ENTRY, s.entry], [H_THOUGHT, s.thought], [H_WANTS, s.wants]].forEach(function (part) {
        if (part[1]) extra += '<section class="ls-part"><h2 class="ls-part-h">' + esc(part[0]) + '</h2><p class="ls-part-p">' + esc(part[1]) + "</p></section>";
      });
      show(
        heart() +
        '<h1 tabindex="-1">' + esc(s.title) + "</h1>" +
        '<p class="ls-purpose">' + esc(s.purpose) + "</p>" +
        '<p class="ls-length">' + esc(LENGTH_LINE) + "</p>" +
        extra +
        (s.video ? '<div class="ls-video" style="margin-top:24px">' + videoHTML(s.video, "Emergency Tapping") + "</div>" : "") +
        '<section class="ls-rate-block">' +
          '<h2 id="ls-rate-h" class="ls-rate-h2">' + esc(RATE_FIRST) + "</h2>" +
          sliderHTML(r.before) +
        "</section>" +
        navHTML("Next", "ls-back"),
        opts
      );
      bindSlider(function (n) { r.before = n; });
      on("ls-back", function () { go("#/"); });
      on("ls-next", function () { if (r.start === null) r.start = r.before; r.step = "setup"; renderStep(); });
      return;
    }

    if (r.step === "rate1" || r.step === "rate2") {
      var first = r.step === "rate1";
      var v = first ? r.before : (r.after === null ? r.before : r.after);
      show(
        heart() +
        '<h1 id="ls-rate-h" class="ls-rate-h" tabindex="-1">' + esc(first ? RATE_FIRST : RATE_AGAIN) + "</h1>" +
        sliderHTML(v) +
        navHTML("Next", "ls-back"),
        opts
      );
      bindSlider(function (n) { if (first) r.before = n; else r.after = n; });
      on("ls-back", function () {
        if (first) r.step = "intro";
        else { r.step = "tap"; r.round = s.rounds.length - 1; r.point = 0; }
        renderStep();
      });
      on("ls-next", function () {
        if (first) { if (r.start === null) r.start = r.before; r.step = "setup"; }
        else { if (r.after === null) r.after = v; r.step = r.after > 3 ? "again" : "done"; }
        renderStep();
      });
      return;
    }

    if (r.step === "setup") {
      show(
        heart() +
        '<h1 tabindex="-1">Set-Up Statement</h1>' +
        '<p class="ls-instruction">' + esc(KARATE) + "</p>" +
        pictureHTML("Karate Chop") +
        '<ol class="ls-statements">' + s.setup.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol>" +
        navHTML("Next", "ls-back"),
        opts
      );
      on("ls-back", function () { r.step = r.after === null ? "intro" : "again"; renderStep(); });
      on("ls-next", function () { r.step = "tap"; r.round = 0; r.point = 0; renderStep(); });
      return;
    }

    if (r.step === "tap") {
      var rd = s.rounds[r.round];
      var last = r.round === s.rounds.length - 1;
      var lines = POINTS.map(function (name, i) {
        return '<li><button type="button" class="ls-line' + (i === r.point ? " on" : "") + '" data-i="' + i + '" aria-pressed="' + (i === r.point) + '">' +
          "<b>" + esc(name) + "</b><span>" + esc(rd.words[i]) + "</span></button></li>";
      }).join("");
      show(
        heart() +
        '<h1 class="ls-round-title" tabindex="-1">' + esc(rd.title) + "</h1>" +
        (rd.note ? '<p class="ls-round-note">' + esc(rd.note) + "</p>" : "") +
        '<div class="ls-pic-sticky">' + pictureHTML(POINTS[r.point]) + "</div>" +
        '<ol class="ls-lines">' + lines + "</ol>" +
        '<p class="ls-breath">' + esc(last ? BREATH_LAST : BREATH_NEXT) + "</p>" +
        navHTML("Next", "ls-back").replace('class="ls-nav"', 'class="ls-nav ls-nav-tight"'),
        opts
      );
      var flash = document.getElementById("ls-flash");
      Array.prototype.forEach.call(app.querySelectorAll(".ls-line"), function (btn) {
        btn.addEventListener("click", function () {
          r.point = parseInt(btn.getAttribute("data-i"), 10);
          Array.prototype.forEach.call(app.querySelectorAll(".ls-line"), function (b) {
            var onNow = b === btn;
            b.classList.toggle("on", onNow);
            b.setAttribute("aria-pressed", String(onNow));
          });
          flash.setAttribute("style", spotStyle(POINTS[r.point]));
        });
      });
      on("ls-back", function () {
        if (r.round > 0) { r.round--; r.point = 0; }
        else r.step = "setup";
        renderStep();
      });
      on("ls-next", function () {
        if (!last) { r.round++; r.point = 0; }
        else r.step = "rate2";
        renderStep();
      });
      return;
    }

    if (r.step === "again") {
      show(
        heart() +
        '<h1 tabindex="-1">' + esc(s.title) + "</h1>" +
        '<p class="ls-lead" style="margin-top:20px">' + esc(STILL_HIGH) + "</p>" +
        '<div class="ls-stack">' +
          '<button type="button" class="ls-btn" id="ls-again">Go again</button>' +
          '<button type="button" class="ls-btn ls-ghost" id="ls-next">Next</button>' +
        "</div>",
        opts
      );
      on("ls-again", function () { r.before = r.after; r.step = "setup"; renderStep(); });
      on("ls-next", function () { r.step = "done"; renderStep(); });
      return;
    }

    if (r.step === "done") {
      var from = r.start === null ? r.before : r.start;
      var now = r.after === null ? from : r.after;
      show(
        heart() +
        '<h1 tabindex="-1">' + esc(s.title) + "</h1>" +
        '<div class="ls-win">' +
          '<p class="ls-win-scores">You started at <b>' + from + "</b>. You’re now at <b>" + now + "</b>.</p>" +
          '<p class="ls-win-msg">' + esc(now < from ? SETTLED : NOT_YET) + "</p>" +
        "</div>" +
        '<p class="ls-lead" style="margin-top:24px">' + esc(CLOSING) + "</p>" +
        '<p class="ls-sign">Nicky xoxo</p>' +
        '<div class="ls-stack">' +
          '<button type="button" class="ls-btn" id="ls-again">Go again</button>' +
          '<button type="button" class="ls-btn ls-ghost" id="ls-other">Try another script</button>' +
          '<button type="button" class="ls-btn ls-ghost" data-go="#/">Back to home</button>' +
          (FROM_TRACKER ? '<a class="ls-btn ls-ghost" href="https://energydetective.online/trigger-tracker">Back to my Trigger Tracker</a>' : "") +
          (FROM_LOVETYPE ? '<a class="ls-btn ls-ghost" href="https://energydetective.online/your-love-type">Back to my love type</a>' : "") +
        "</div>",
        opts
      );
      on("ls-again", function () { r.before = now; r.after = null; r.step = "setup"; renderStep(); });
      on("ls-other", function () { wantCards = true; go("#/"); });
    }
  }

  /* ---------- Routes ---------- */
  function findScript(id) {
    if (id === "sos") return RESET;
    for (var i = 0; i < SCRIPTS.length; i++) if (SCRIPTS[i].id === id) return SCRIPTS[i];
    return null;
  }
  /* links like lovesos-tool#i-feel-triggered (the script name in lowercase, apostrophes removed,
     spaces as hyphens) open that script straight away, e.g. from the Trigger Tracker */
  function slug(t) {
    return String(t).toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function findScriptBySlug(h) {
    if (!h || h.indexOf("/") >= 0) return null;
    try { h = decodeURIComponent(h); } catch (e) { /* use as typed */ }
    var k = slug(h), all = SCRIPTS.concat([RESET]);
    for (var i = 0; i < all.length; i++) if (slug(all[i].name) === k || slug(all[i].title) === k) return all[i];
    return null;
  }

  function route() {
    if (!getFlag(KEY_UNLOCKED)) { renderPassword(); return; }
    var h = (location.hash || "").replace(/^#\/?/, "");
    var direct = findScriptBySlug(h);
    if (direct) return startScript(direct);
    if (!getFlag(KEY_WELCOMED)) { renderWelcome(true); return; }
    var parts = h.split("/");
    if (h === "" ) return renderHome();
    if (h === "about") return renderWelcome(false);
    if (h === "videos") return renderVideos();
    if (h === "chart") return renderChart();
    if (h === "wheel") return renderWheel();
    if (h === "sos") return startScript(RESET);
    if (parts[0] === "script") {
      var s = findScript(parts[1]);
      if (s) return startScript(s);
    }
    renderHome();
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    var t = e.target.closest("[data-go]");
    if (t && app.contains(t)) { e.preventDefault(); go(t.getAttribute("data-go")); return; }
    // links inside the tool (e.g. "New here?" and the wheel's script names) move within the page,
    // so they also work where a page is shown inside a preview or an in-app browser
    var a = e.target.closest('a[href^="#/"]');
    if (a) { e.preventDefault(); go(a.getAttribute("href")); }
  });
  on("ls-home", function () { go("#/"); });
  on("ls-sos-mini", function () { go("#/sos"); });
  window.addEventListener("hashchange", route);
  route();
})();
</script>

<script>
  /* The Relationship Wheel of Life: each script name in the results opens that script in this tool. */
  window.RW_SCRIPT_LINKS = {
    "I Feel Triggered": "#/script/triggered",
    "I Feel Rejected": "#/script/rejected",
    "Fear of Fallout": "#/script/fallout",
    "Resentment": "#/script/resentment",
    "Find Your Voice": "#/script/voice",
    "Releasing the Blame Game": "#/script/blame",
    "Everything Feels Negative": "#/script/negative",
    "Expressing Love": "#/script/expressing",
    "Open to Love": "#/script/open",
    "Feeling Like I've Lost Myself": "#/script/lost",
    "Emergency Emotional Reset": "#/sos"
  };
</script>
<script>
(function () {
  "use strict";

  /* ---------- Copy ---------- */
  var AREAS = [
    { name: "Trust", q: "Do I feel safe and secure in love?", line: "Feeling safe, secure and able to rely on each other.",
      note: "When trust scores low, your nervous system is staying on alert, waiting to be let down. That watchfulness usually started long before this relationship. It's tiring, living braced for hurt.",
      start: "Open to Love", then: "Fear of Fallout" },
    { name: "Intimacy", q: "Do I feel close, wanted, and connected?", line: "Closeness, affection and feeling wanted.",
      note: "When closeness scores low, you can end up feeling more like housemates than partners. Often the love hasn't gone. Old hurt is keeping you at a distance, even from someone you care about.",
      start: "Expressing Love", then: "Open to Love" },
    { name: "Communication", q: "Can I say what I feel and be heard?", line: "Saying how you feel and being listened to.",
      note: "When you don't feel heard, you either say less or say it louder. Both leave you feeling alone in the conversation. Your nervous system learnt one of those habits years ago, to keep you safe.",
      start: "Find Your Voice", then: "Releasing the Blame Game" },
    { name: "Boundaries", q: "Can I say no without guilt or fear?", line: "Being able to say no, and having it respected.",
      note: "When saying no feels hard, you're probably saying yes and paying for it later. The guilt or fear that comes up isn't really about this request. It's an old fear of what happens when you put yourself first.",
      start: "Fear of Fallout", then: "Find Your Voice" },
    { name: "Freedom", q: "Can I still be myself?", line: "Having your own life, interests and sense of self.",
      note: "When you can't be yourself, you've slowly fitted your life around theirs. It rarely happens on purpose. It happens one small yes at a time, until you don't recognise yourself.",
      start: "Feeling Like I've Lost Myself", then: "" },
    { name: "Support", q: "Do I feel like we are a team?", line: "Facing life together and sharing the load.",
      note: "When you don't feel like a team, it can feel like you're carrying it all, or like you're on opposite sides. That's often when blame creeps in.",
      start: "Releasing the Blame Game", then: "Resentment" },
    { name: "Fun", q: "Do we laugh, enjoy life, and feel light together?", line: "Laughter, lightness and enjoying each other.",
      note: "When the fun has gone, everything starts to feel heavy and serious. It doesn't mean the relationship is over. It often means you've both been carrying too much for too long.",
      start: "Everything Feels Negative", then: "Expressing Love" },
    { name: "Respect", q: "Do I feel valued, appreciated, and treated well?", line: "Feeling valued, appreciated and treated well.",
      note: "When you don't feel valued, you notice every time you're overlooked, and it stings more each time. That hurt quietly builds into resentment, even when you say nothing.",
      start: "I Feel Rejected", then: "Resentment" }
  ];

  var COPY = {
    title: "The Relationship Wheel of Life",
    lede: "See where your relationship feels good, and where it's feeling the strain.",
    welcome1: "When your relationship feels off, it's hard to put your finger on where. It might be trust, not feeling heard, or feeling like you've lost yourself along the way.",
    welcome2: "This wheel looks at 8 parts of your relationship, one at a time. In about 2 minutes, you'll see which parts feel good, which feel hardest, and which Love SOS script to start with.",
    intro: "Score each of the 8 areas from 0 to 10, thinking about your relationship as it is right now. There are no right answers. Go with your first feeling.",
    time: "Takes about 2 minutes. Your answers stay on your phone.",
    nameLabel: "Your first name (for your saved wheel):",
    start: "Start my wheel",
    resultsTitle: "Your Relationship Wheel of Life",
    working: "What's working",
    workingIntro: "Your strongest areas. These are what's holding things together right now, so notice them.",
    hardest: "Where it feels hardest right now",
    even: "How even is your wheel?",
    gapLow: "Your wheel is fairly even. Small shifts in your lower areas can make a real difference to how the whole relationship feels.",
    gapMid: "Some areas are under more strain than others. When one part feels hard, it tends to spill into the rest, so start with your lowest.",
    gapHigh: "Your wheel is quite uneven. Some areas feel good while others feel really hard. That's very common, and it usually means a few old reactions are having a big effect. Start with your lowest area.",
    closing: "These scores aren't a judgement on you or your relationship. They show where things feel hardest right now, and where to start.",
    save: "Save my wheel",
    share: "Share to Notes",
    again: "Do it again",
    againLine: "Come back in a month and see what's shifted.",
    copied: "Copied",
    openingEven: "Your scores are even across all eight areas.",
    workingNone: "None of your areas feel strong right now. That's a lot to be carrying, and it's why starting small matters.",
    startHeading: "Where to start",
    startLine: "None of your areas scored low. These are your lowest, so they're the best place to start.",
    overallLow: "Most of your relationship feels hard right now. That's a lot to carry, and it makes sense that you're feeling it. You don't have to change everything at once. Start with your lowest area, one script at a time.",
    overallLowEvenEnd: "Start with the Emergency Emotional Reset, then come back to your wheel when you feel steadier.",
    safety: "If you ever feel unsafe in your relationship, please reach out to someone you trust or a local support service.",
    sameAsLast: "Your scores are the same as last time."
  };

  var STORE_KEY = "energy-detective-relationship-wheel";

  /* ---------- Helpers ---------- */
  function curly(s) { return String(s).replace(/'/g, "’"); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function t(s) { return esc(curly(s)); }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }); }
    catch (e) { return ""; }
  }
  function average(scores) {
    var sum = 0;
    for (var i = 0; i < scores.length; i++) sum += scores[i];
    return (sum / scores.length).toFixed(1);
  }
  function gapMessage(scores) {
    var gap = Math.max.apply(null, scores) - Math.min.apply(null, scores);
    if (gap <= 3) return COPY.gapLow;
    if (gap <= 5) return COPY.gapMid;
    return COPY.gapHigh;
  }

  /* Works out which areas show where, and which messages apply. */
  function analyse(scores) {
    var order = [0, 1, 2, 3, 4, 5, 6, 7];
    var allSame = scores.every(function (v) { return v === scores[0]; });
    var asc = order.slice().sort(function (a, b) { return scores[a] - scores[b] || a - b; });
    var desc = order.slice().sort(function (a, b) { return scores[b] - scores[a] || a - b; });
    var lowAll = asc.filter(function (i) { return scores[i] <= 4; });
    // "even": every score the same; "low": something scores 4 or under; "start": nothing does
    var mode = allSame ? "even" : lowAll.length ? "low" : "start";
    var low = mode === "even" ? [] : mode === "low" ? lowAll.slice(0, 4) : asc.slice(0, 2);
    var high = mode === "even" ? [] : desc.filter(function (i) { return scores[i] >= 6 && low.indexOf(i) === -1; }).slice(0, 3);
    var overallLow = parseFloat(average(scores)) <= 4;
    return {
      mode: mode,
      low: low,
      high: high,
      also: mode === "low" ? lowAll.slice(4) : [],
      overallLow: overallLow,
      safety: overallLow || scores[0] <= 1 || scores[3] <= 1
    };
  }

  function joinList(items) {
    if (items.length <= 1) return items.join("");
    return items.slice(0, -1).join(", ") + " and " + items[items.length - 1];
  }
  function joinNames(list) { return joinList(list.map(function (i) { return AREAS[i].name; })); }

  function openingLine(scores, L) {
    if (L.mode === "even") return COPY.openingEven;
    var word = L.mode === "start" ? "lowest" : "hardest";
    if (!L.high.length) return "Your relationship feels " + word + " in " + joinNames(L.low) + ".";
    return "Your relationship feels strongest in " + joinNames(L.high) + ", and " + word + " in " + joinNames(L.low) + ".";
  }

  function hardestHeading(L) { return L.mode === "start" ? COPY.startHeading : COPY.hardest; }

  function alsoLine(scores, L) {
    return "Also scoring low: " + joinList(L.also.map(function (i) { return AREAS[i].name + " (" + scores[i] + ")"; })) + ".";
  }

  var RESET = "Emergency Emotional Reset";
  function evenMessage(scores, L) {
    if (!L.overallLow) return gapMessage(scores);
    if (L.mode !== "even") return COPY.overallLow;
    // every score the same and 4 or under: swap the last sentence for the Emergency Emotional Reset
    return COPY.overallLow.replace("Start with your lowest area, one script at a time.", COPY.overallLowEvenEnd);
  }
  function evenMessageHTML(scores, L) {
    var html = t(evenMessage(scores, L));
    return html.indexOf(RESET) === -1 ? html : html.replace(RESET, scriptLink(RESET));
  }

  function changesLine(scores, prev) {
    var moved = [0, 1, 2, 3, 4, 5, 6, 7].filter(function (i) { return scores[i] !== prev[i]; });
    if (!moved.length) return COPY.sameAsLast;
    moved.sort(function (a, b) { return Math.abs(scores[b] - prev[b]) - Math.abs(scores[a] - prev[a]) || a - b; });
    return "Since last time: " + moved.slice(0, 3).map(function (i) {
      var d = scores[i] - prev[i];
      return AREAS[i].name + (d > 0 ? " up " : " down ") + Math.abs(d);
    }).join(", ") + ".";
  }

  /* ---------- Saving (device only) ---------- */
  function loadSaved() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || typeof d !== "object") return null;
      var ok = Array.isArray(d.scores) && d.scores.length === 8 && d.scores.every(function (n) {
        return typeof n === "number" && n >= 0 && n <= 10;
      });
      return { name: typeof d.name === "string" ? d.name : "", date: ok ? d.date : null, scores: ok ? d.scores : null };
    } catch (e) { return null; }
  }
  function saveResult(obj) {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) { /* storage blocked: carry on */ }
  }

  /* ---------- State ---------- */
  var saved = loadSaved();
  var state = {
    screen: "welcome",
    i: 0,
    name: saved && saved.name ? saved.name : "",
    scores: [5, 5, 5, 5, 5, 5, 5, 5],
    previous: null,
    date: null
  };

  var app = document.getElementById("rw");

  function show(html, focusSel) {
    app.innerHTML = html;
    var top = app.getBoundingClientRect().top;
    if (top < 0) app.scrollIntoView({ block: "start" });
    var f = focusSel && app.querySelector(focusSel);
    if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
  }

  /* ---------- Radar chart (SVG) ---------- */
  var VB_W = 560, VB_H = 450, CX = 280, CY = 222, R = 132;

  function pt(i, v, r) {
    var a = (Math.PI * 2 * i) / 8 - Math.PI / 2;
    var rr = (v / 10) * (r || R);
    return [CX + rr * Math.cos(a), CY + rr * Math.sin(a)];
  }
  function poly(scores) {
    return scores.map(function (v, i) { var p = pt(i, v); return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  }

  function radarSVG(scores, prev) {
    var s = '<svg viewBox="0 0 ' + VB_W + " " + VB_H + '" role="img" aria-label="' +
      esc("Your wheel: " + AREAS.map(function (a, i) { return a.name + " " + scores[i]; }).join(", ")) + '">';
    for (var l = 2; l <= 10; l += 2) {
      var ring = [];
      for (var i = 0; i < 8; i++) { var p = pt(i, l); ring.push(p[0].toFixed(1) + "," + p[1].toFixed(1)); }
      s += '<polygon points="' + ring.join(" ") + '" fill="none" stroke="#FBBECA" stroke-width="' + (l === 10 ? 1.2 : 0.8) + '"/>';
    }
    for (var j = 0; j < 8; j++) {
      var e = pt(j, 10);
      s += '<line x1="' + CX + '" y1="' + CY + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="#FBBECA" stroke-width="0.8"/>';
    }
    if (prev) {
      s += '<polygon points="' + poly(prev) + '" fill="none" stroke="#FC889B" stroke-width="2.4" stroke-dasharray="6 5" stroke-linejoin="round"/>';
    }
    s += '<polygon points="' + poly(scores) + '" fill="#A7B9A0" fill-opacity="0.6" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>';
    scores.forEach(function (v, i) {
      var p = pt(i, v);
      s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>';
    });
    AREAS.forEach(function (a, i) {
      var p = pt(i, 10, R + 18);
      var anchor = p[0] < CX - 10 ? "end" : p[0] > CX + 10 ? "start" : "middle";
      var dy = p[1] < CY - R ? -22 : p[1] > CY + R ? 6 : -8;
      if (p[1] < CY - 40 && p[1] > CY - R) dy = -18;
      if (p[1] > CY + 40 && p[1] < CY + R) dy = 2;
      s += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy + 12).toFixed(1) + '" text-anchor="' + anchor +
        '" font-family="Poppins, sans-serif" font-size="15" font-weight="500" fill="#000000">' + esc(a.name) + "</text>";
      s += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy + 34).toFixed(1) + '" text-anchor="' + anchor +
        '" font-family="\'Playfair Display\', serif" font-size="21" font-weight="800" fill="#000000">' + scores[i] + "</text>";
    });
    return s + "</svg>";
  }

  /* ---------- The black spotted heart (once per screen) ---------- */
  var HEART = '<svg class="rw-heart" viewBox="0 0 100 92" aria-hidden="true" focusable="false">' +
    '<path d="M50.5 88.5C35 76 9 58.5 6.2 35.8 4 17.6 15.6 5.4 29.4 5.6c9.6.2 16.8 6.4 20.6 14.6C54.2 11.4 61.8 4.6 72.2 4.4 85.8 4.2 96.4 15.8 94.6 33.4 92.4 56.2 67 75.6 50.5 88.5Z" fill="#000000"/>' +
    '<g fill="#FFFFFF"><ellipse cx="24" cy="24" rx="2.6" ry="2.2"/><ellipse cx="38" cy="33" rx="2.1" ry="2.5"/><ellipse cx="17" cy="41" rx="2.2" ry="2"/>' +
    '<ellipse cx="31" cy="50" rx="2.6" ry="2.3"/><ellipse cx="72" cy="20" rx="2.3" ry="2.6"/><ellipse cx="58" cy="30" rx="2.5" ry="2.2"/>' +
    '<ellipse cx="82" cy="35" rx="2.1" ry="2"/><ellipse cx="66" cy="45" rx="2.6" ry="2.4"/><ellipse cx="48" cy="52" rx="2" ry="2.3"/>' +
    '<ellipse cx="44" cy="68" rx="2.4" ry="2.1"/><ellipse cx="58" cy="63" rx="1.8" ry="1.9"/><ellipse cx="76" cy="54" rx="1.6" ry="1.7"/></g></svg>';

  /* ---------- Screens ---------- */
  function renderWelcome() {
    show(
      '<div class="rw-wrap rw-screen">' + HEART +
        '<h1 tabindex="-1">The Relationship <em class="rw-accent">Wheel</em> of Life</h1>' +
        '<p class="rw-lede">' + t(COPY.lede) + "</p>" +
        '<hr class="rw-rule">' +
        '<p class="rw-body">' + t(COPY.welcome1) + "</p>" +
        '<p class="rw-body">' + t(COPY.welcome2) + "</p>" +
        '<p class="rw-body">' + t(COPY.intro) + "</p>" +
        '<p class="rw-body rw-small">' + t(COPY.time) + "</p>" +
        '<div class="rw-field">' +
          '<label for="rw-name">' + t(COPY.nameLabel) + "</label>" +
          '<input id="rw-name" type="text" autocomplete="given-name" autocapitalize="words" maxlength="40" value="' + esc(state.name) + '">' +
        "</div>" +
        '<div class="rw-nav">' +

      "</div>",

    );
    var input = document.getElementById("rw-name");
    input.addEventListener("input", function () { state.name = input.value; });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") begin(); });
    document.getElementById("rw-start").addEventListener("click", begin);
    document.getElementById("rw-home-back").addEventListener("click", function () { location.hash = "#/"; });
  }

  function begin() {
    state.name = (state.name || "").trim().slice(0, 40);
    state.i = 0;
    renderArea();
  }

  function renderArea() {
    var a = AREAS[state.i];
    var v = state.scores[state.i];
    show(
      '<div class="rw-wrap rw-screen">' + HEART +
        '<div class="rw-progress"><span>Area ' + (state.i + 1) + " of 8</span>" +
          '<div class="rw-bar" aria-hidden="true"><span style="width:' + ((state.i + 1) / 8) * 100 + '%"></span></div></div>' +
        '<h2 class="rw-area-name" tabindex="-1">' + t(a.name) + "</h2>" +
        '<p class="rw-question" id="rw-q">' + t(a.q) + "</p>" +
        '<p class="rw-line">' + t(a.line) + "</p>" +
        '<div class="rw-value" id="rw-val" aria-hidden="true">' + v + "</div>" +
        '<div class="rw-slider">' +
          '<div class="rw-track"></div><div class="rw-fill" id="rw-fill" style="width:' + v * 10 + '%"></div>' +
          '<input type="range" id="rw-range" min="0" max="10" step="1" value="' + v + '" aria-labelledby="rw-q" aria-valuetext="' + v + ' out of 10">' +
        "</div>" +
        '<div class="rw-ends" aria-hidden="true"><span><b>0</b>Not at all</span><span><b>10</b>Completely</span></div>' +
        '<div class="rw-nav">' +
          '<button type="button" class="rw-btn rw-ghost" id="rw-back">Back</button>' +
          '<button type="button" class="rw-btn" id="rw-next">Next</button>' +
        "</div>" +
      "</div>",
      "h2"
    );
    var range = document.getElementById("rw-range");
    var val = document.getElementById("rw-val");
    var fill = document.getElementById("rw-fill");
    function sync() {
      var n = parseInt(range.value, 10);
      state.scores[state.i] = n;
      val.textContent = n;
      // thumb centre sits slightly in from each edge; keep the fill under it
      fill.style.width = "calc(" + n * 10 + "% + " + (17 - n * 3.4).toFixed(1) + "px)";
      range.setAttribute("aria-valuetext", n + " out of 10");
    }
    range.addEventListener("input", sync);
    range.addEventListener("change", sync);
    sync();
    document.getElementById("rw-back").addEventListener("click", function () {
      if (state.i === 0) renderWelcome(); else { state.i--; renderArea(); }
    });
    document.getElementById("rw-next").addEventListener("click", function () {
      if (state.i < 7) { state.i++; renderArea(); } else finish();
    });
  }

  function finish() {
    if (!state.reopened) {
      var before = loadSaved();
      state.previous = before && before.scores ? { scores: before.scores, date: before.date } : null;
    }
    state.reopened = false;
    state.date = new Date().toISOString();
    saveResult({ name: state.name, date: state.date, scores: state.scores.slice() });
    renderResults();
  }

  function scriptLink(name) {
    var links = window.RW_SCRIPT_LINKS || {};
    var url = typeof links[name] === "string" ? links[name].trim() : "";
    var label = "<em>" + t(name) + "</em>";
    if (!url || /^\s*(javascript|data|vbscript):/i.test(url)) return label;
    return '<a href="' + esc(url) + '">' + label + "</a>";
  }

  function scriptsHTML(a) {
    var h = "<p>Start with: " + scriptLink(a.start) + ".";
    if (a.then) h += " Then try: " + scriptLink(a.then) + ".";
    return h + "</p>";
  }

  function lists() { return analyse(state.scores); }

  function renderResults() {
    var sc = state.scores;
    var prev = state.previous;
    var L = lists();
    var html = '<div class="rw-wrap rw-wide rw-screen">' + HEART;

    html += '<h1 tabindex="-1">Your Relationship <em class="rw-accent">Wheel</em> of Life</h1>';
    html += '<p class="rw-meta">' + (state.name ? esc(state.name) + " &middot; " : "") + esc(fmtDate(state.date)) + "</p>";
    html += '<p class="rw-opening">' + t(openingLine(sc, L)) + "</p>";

    html += '<div class="rw-chart">' + radarSVG(sc, prev ? prev.scores : null) + "</div>";
    if (prev) {
      html += '<div class="rw-legend"><span><i></i>Now</span><span><i class="rw-prev"></i>Last time, ' + esc(fmtDate(prev.date)) + "</span></div>";
    }

    html += '<p class="rw-overall">Your overall score: <strong>' + average(sc) + "</strong> out of 10</p>";
    if (prev) html += '<p class="rw-change">' + t(changesLine(sc, prev.scores)) + "</p>";

    if (prev) {
      html += '<ul class="rw-list" style="margin-top:40px">';
      AREAS.forEach(function (a, i) {
        html += '<li><span class="rw-name">' + t(a.name) + '</span><span class="rw-score">' + sc[i] +
          '<span class="rw-was">Last time ' + prev.scores[i] + "</span></span></li>";
      });
      html += "</ul>";
    }

    if (L.mode !== "even") {
      html += '<section class="rw-section"><h2>' + t(COPY.working) + "</h2>";
      if (L.high.length) {
        html += "<p>" + t(COPY.workingIntro) + '</p><ul class="rw-list">';
        L.high.forEach(function (i) {
          html += '<li><span class="rw-name">' + t(AREAS[i].name) + '</span><span class="rw-score">' + sc[i] + " / 10</span></li>";
        });
        html += "</ul>";
      } else {
        html += "<p>" + t(COPY.workingNone) + "</p>";
      }
      html += "</section>";

      html += '<section class="rw-section"><h2>' + t(hardestHeading(L)) + "</h2>";
      if (L.mode === "start") html += '<p style="margin-top:12px">' + t(COPY.startLine) + "</p>";
      L.low.forEach(function (i) {
        var a = AREAS[i];
        html += '<article class="rw-card"><div class="rw-card-head"><h3>' + t(a.name) + '</h3><span class="rw-score">' + sc[i] + " / 10</span></div>" +
          '<p class="rw-note">' + t(a.note) + '</p><div class="rw-scripts">' + scriptsHTML(a) + "</div></article>";
      });
      if (L.also.length) html += '<p class="rw-also">' + t(alsoLine(sc, L)) + "</p>";
      html += "</section>";
    }

    html += '<section class="rw-section"><h2>' + t(COPY.even) + "</h2><p class=\"rw-even-msg\" style=\"margin-top:16px\">" + evenMessageHTML(sc, L) + "</p></section>";

    if (L.safety) html += '<p class="rw-safety">' + t(COPY.safety) + "</p>";
    html += '<p class="rw-closing">' + t(COPY.closing) + "</p>";

    html += '<div class="rw-actions">' +
      '<button type="button" class="rw-btn" id="rw-save">' + t(COPY.save) + "</button>" +
      '<button type="button" class="rw-btn rw-ghost" id="rw-share">' + t(COPY.share) + "</button>" +
      "</div>" +
      '<div class="rw-again"><button type="button" class="rw-btn rw-ghost" id="rw-again">' + t(COPY.again) + "</button>" +
      "<p>" + t(COPY.againLine) + "</p></div>" +
      '<div class="rw-nav rw-back-only"><button type="button" class="rw-btn rw-ghost" id="rw-res-back">Back</button></div>' +
      '<span class="rw-sr" id="rw-status" role="status"></span>';

    html += "</div>";
    show(html, "h1");

    document.getElementById("rw-res-back").addEventListener("click", function () { state.reopened = true; state.i = 7; renderArea(); });
    document.getElementById("rw-save").addEventListener("click", savePDF);
    document.getElementById("rw-share").addEventListener("click", share);
    document.getElementById("rw-again").addEventListener("click", function () {
      state.scores = [5, 5, 5, 5, 5, 5, 5, 5];
      state.previous = null;
      state.reopened = false;
      state.i = 0;
      renderWelcome();
    });
  }

  /* ---------- Share to Notes ---------- */
  function summaryText() {
    var sc = state.scores, prev = state.previous, L = lists();
    var out = [];
    out.push(COPY.resultsTitle);
    out.push((state.name ? state.name + ", " : "") + fmtDate(state.date));
    out.push("");
    out.push(openingLine(sc, L));
    out.push("");
    out.push("Your overall score: " + average(sc) + " out of 10");
    if (prev) out.push(changesLine(sc, prev.scores));
    out.push("");
    AREAS.forEach(function (a, i) {
      out.push(a.name + ": " + sc[i] + (prev ? " (last time " + prev.scores[i] + ")" : ""));
    });
    if (L.mode !== "even") {
      out.push("");
      out.push(COPY.working);
      if (L.high.length) L.high.forEach(function (i) { out.push(AREAS[i].name + ": " + sc[i]); });
      else out.push(COPY.workingNone);
      out.push("");
      out.push(hardestHeading(L));
      if (L.mode === "start") out.push(COPY.startLine);
      L.low.forEach(function (i) {
        var a = AREAS[i];
        out.push("");
        out.push(a.name + ": " + sc[i]);
        out.push(a.note);
        out.push("Start with: " + a.start + "." + (a.then ? " Then try: " + a.then + "." : ""));
      });
      if (L.also.length) { out.push(""); out.push(alsoLine(sc, L)); }
    }
    out.push("");
    out.push(COPY.even);
    out.push(evenMessage(sc, L));
    if (L.safety) { out.push(""); out.push(COPY.safety); }
    out.push("");
    out.push(COPY.closing);
    return out.join("\n");
  }

  function flashCopied(btn) {
    var status = document.getElementById("rw-status");
    btn.textContent = COPY.copied;
    if (status) status.textContent = COPY.copied;
    setTimeout(function () {
      btn.textContent = curly(COPY.share);
      if (status) status.textContent = "";
    }, 2200);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function share() {
    var btn = document.getElementById("rw-share");
    var text = summaryText();
    if (navigator.share) {
      navigator.share({ title: COPY.resultsTitle, text: text }).catch(function (err) {
        if (err && err.name === "AbortError") return; // she closed the share menu
        copyText(text).then(function (ok) { if (ok) flashCopied(btn); });
      });
      return;
    }
    copyText(text).then(function (ok) { if (ok) flashCopied(btn); });
  }

  /* ---------- Save my wheel (one-page PDF, built in the browser) ---------- */
  var PW = 595.28, PH = 841.89, PX = 2.5; // A4 in points, pixels per point

  function loadFonts() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var faces = [
      '800 40px "Playfair Display"', 'italic 800 40px "Playfair Display"',
      'italic 400 40px "Playfair Display"',
      '400 20px "Poppins"', '500 20px "Poppins"'
    ];
    var all = Promise.all(faces.map(function (f) { return document.fonts.load(f).catch(function () {}); }));
    var timeout = new Promise(function (res) { setTimeout(res, 2500); });
    return Promise.race([all, timeout]);
  }

  var SERIF = '"Playfair Display", Georgia, serif';
  var SANS = '"Poppins", Helvetica, Arial, sans-serif';

  function wrapLines(ctx, text, maxW) {
    var words = text.split(" "), lines = [], line = "";
    words.forEach(function (w) {
      var test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }

  function drawRuns(ctx, x, y, runs) {
    // runs: [{text, font, color}]
    runs.forEach(function (r) {
      ctx.font = r.font;
      ctx.fillStyle = r.color;
      ctx.fillText(r.text, x, y);
      x += ctx.measureText(r.text).width;
    });
    return x;
  }

  function drawPage(ctx, k) {
    var sc = state.scores, prev = state.previous, L = lists();
    var M = 46, CW = PW - M * 2, y = M;

    ctx.setTransform(PX, 0, 0, PX, 0, 0);
    ctx.fillStyle = "#FFF7F7";
    ctx.fillRect(0, 0, PW, PH);
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";

    // Title
    var ts = 28 * k;
    y += ts * 0.8;
    drawRuns(ctx, M, y, [
      { text: "Your Relationship ", font: "800 " + ts + "px " + SERIF, color: "#000000" },
      { text: "Wheel", font: "800 " + ts + "px " + SERIF, color: "#FC889B" },
      { text: " of Life", font: "800 " + ts + "px " + SERIF, color: "#000000" }
    ]);
    y += 16 * k;
    ctx.font = "400 " + 9 * k + "px " + SANS;
    ctx.fillStyle = "#000000";
    ctx.fillText((state.name ? state.name + "  ·  " : "") + fmtDate(state.date), M, y);
    y += 18 * k;
    ctx.font = "400 " + 11 * k + "px " + SANS;
    ctx.fillStyle = "#000000";
    wrapLines(ctx, curly(openingLine(sc, L)), CW).forEach(function (l) { ctx.fillText(l, M, y); y += 16 * k; });
    y -= 4 * k;
    ctx.fillStyle = "#FC889B";
    ctx.fillRect(M, y, 34, 0.75);
    y += 14 * k;

    // Chart (left) and scores (right)
    var C = 250 * k;
    var rowTop = y;
    drawRadarCanvas(ctx, M + C / 2 - 6, rowTop + C / 2, C * 0.28, sc, prev ? prev.scores : null, k);
    var rx = M + C + 30;
    var rw = PW - M - rx;
    var ry = rowTop + 28 * k;
    ctx.font = "400 " + 9.5 * k + "px " + SANS;
    ctx.fillStyle = "#000000";
    ctx.fillText("Your overall score:", rx, ry);
    ry += 40 * k;
    ctx.font = "800 " + 44 * k + "px " + SERIF;
    ctx.fillStyle = "#000000";
    ctx.fillText(average(sc), rx, ry);
    var nw = ctx.measureText(average(sc)).width;
    ctx.font = "400 " + 9.5 * k + "px " + SANS;
    ctx.fillStyle = "#000000";
    ctx.fillText("out of 10", rx + nw + 6, ry);
    ry += 22 * k;
    if (prev) {
      ry += 2 * k;
      ctx.font = "400 " + 8.6 * k + "px " + SANS;
      ctx.fillStyle = "#000000";
      wrapLines(ctx, changesLine(sc, prev.scores), rw).forEach(function (l) { ctx.fillText(l, rx, ry); ry += 12 * k; });
      ry += 6 * k;
    }

    if (prev) {
      ctx.font = "400 " + 7.5 * k + "px " + SANS;
      ctx.fillStyle = "#000000";
      ctx.textAlign = "right";
      ctx.fillText("Now", PW - M - 58 * k, ry);
      ctx.fillText("Last time", PW - M, ry);
      ctx.textAlign = "left";
      ry += 6 * k;
    }
    var rowH = 17 * k;
    ctx.strokeStyle = "#FBBECA";
    ctx.lineWidth = 0.6;
    line(ctx, rx, ry, PW - M, ry);
    AREAS.forEach(function (a, i) {
      var by = ry + rowH;
      ctx.font = "800 " + 12 * k + "px " + SERIF;
      ctx.fillStyle = "#000000";
      ctx.fillText(a.name, rx, by - 5 * k);
      ctx.font = "400 " + 9 * k + "px " + SANS;
      ctx.fillStyle = "#000000";
      ctx.textAlign = "right";
      ctx.fillText(String(sc[i]), prev ? PW - M - 58 * k : PW - M, by - 5 * k);
      if (prev) {
        ctx.fillStyle = "#000000";
        ctx.font = "400 " + 9 * k + "px " + SANS;
        ctx.fillText(String(prev.scores[i]), PW - M, by - 5 * k);
      }
      ctx.textAlign = "left";
      line(ctx, rx, by, PW - M, by);
      ry = by;
    });
    if (prev) {
      ry += 14 * k;
      ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.2; ctx.setLineDash([]);
      line(ctx, rx, ry - 3 * k, rx + 14, ry - 3 * k);
      ctx.font = "400 " + 7.5 * k + "px " + SANS; ctx.fillStyle = "#000000";
      ctx.fillText("Now", rx + 19, ry);
      ctx.strokeStyle = "#FC889B"; ctx.setLineDash([2.5, 2.5]);
      line(ctx, rx + 50 * k, ry - 3 * k, rx + 50 * k + 14, ry - 3 * k);
      ctx.setLineDash([]);
      ctx.fillText("Last time, " + fmtDate(prev.date), rx + 50 * k + 19, ry);
    }
    y = Math.max(rowTop + C, ry) + 18 * k;

    // What's working (left) and How even (right)
    var colW = (CW - 24) / 2;
    var colTop = y;
    var ly = colTop, ryy = colTop;
    var bodyFont = "400 " + 8.6 * k + "px " + SANS, lh = 13 * k;
    var showSections = L.mode !== "even";
    if (showSections) {
      ly += 16 * k;
      ctx.font = "800 " + 17 * k + "px " + SERIF; ctx.fillStyle = "#000000";
      ctx.fillText(curly(COPY.working), M, ly);
      ly += 15 * k;
      ctx.font = bodyFont; ctx.fillStyle = "#000000";
      wrapLines(ctx, curly(L.high.length ? COPY.workingIntro : COPY.workingNone), colW).forEach(function (l) { ctx.fillText(l, M, ly); ly += lh; });
    }
    if (L.high.length) {
      ly += 2 * k;
      ctx.strokeStyle = "#FBBECA"; ctx.lineWidth = 0.6;
      line(ctx, M, ly, M + colW, ly);
      L.high.forEach(function (i) {
        ly += 16 * k;
        ctx.font = "800 " + 12 * k + "px " + SERIF; ctx.fillStyle = "#000000";
        ctx.fillText(AREAS[i].name, M, ly - 4 * k);
        ctx.font = "400 " + 9 * k + "px " + SANS; ctx.fillStyle = "#000000"; ctx.textAlign = "right";
        ctx.fillText(sc[i] + " / 10", M + colW, ly - 4 * k);
        ctx.textAlign = "left";
        line(ctx, M, ly, M + colW, ly);
      });
    }
    var ex = showSections ? M + colW + 24 : M;
    var ew = showSections ? colW : CW;
    ryy += 16 * k;
    ctx.font = "800 " + 17 * k + "px " + SERIF; ctx.fillStyle = "#000000";
    ctx.fillText(COPY.even, ex, ryy);
    ryy += 15 * k;
    ctx.font = bodyFont; ctx.fillStyle = "#000000";
    wrapLines(ctx, curly(evenMessage(sc, L)), ew).forEach(function (l) { ctx.fillText(l, ex, ryy); ryy += lh; });
    y = Math.max(ly, ryy) + 20 * k;

    // Where it feels hardest right now (or Where to start)
    if (showSections) {
      y += 4 * k;
      ctx.font = "800 " + 17 * k + "px " + SERIF; ctx.fillStyle = "#000000";
      ctx.fillText(curly(hardestHeading(L)), M, y);
      y += 8 * k;
      if (L.mode === "start") {
        y += 8 * k;
        ctx.font = bodyFont; ctx.fillStyle = "#000000";
        wrapLines(ctx, curly(COPY.startLine), CW).forEach(function (l) { ctx.fillText(l, M, y); y += lh; });
        y -= 4 * k;
      }
    }
    L.low.forEach(function (i) {
      var a = AREAS[i];
      var pad = 11 * k;
      ctx.font = bodyFont;
      var noteLines = wrapLines(ctx, curly(a.note), CW - pad * 2);
      var h = pad + 14 * k + 6 * k + noteLines.length * lh + 8 * k + 13 * k + pad - 4 * k;
      ctx.fillStyle = "#FBBECA"; ctx.fillRect(M, y, CW, h);
      ctx.strokeStyle = "#FBBECA"; ctx.lineWidth = 0.6; ctx.strokeRect(M, y, CW, h);
      var cy = y + pad + 11 * k;
      ctx.font = "800 " + 14 * k + "px " + SERIF; ctx.fillStyle = "#000000";
      ctx.fillText(a.name, M + pad, cy);
      ctx.font = "400 " + 8.6 * k + "px " + SANS; ctx.fillStyle = "#000000"; ctx.textAlign = "right";
      ctx.fillText(sc[i] + " / 10", M + CW - pad, cy);
      ctx.textAlign = "left";
      cy += 6 * k + lh - 2 * k;
      ctx.font = bodyFont; ctx.fillStyle = "#000000";
      noteLines.forEach(function (l) { ctx.fillText(l, M + pad, cy); cy += lh; });
      cy += 4 * k;
      var plain = "400 " + 8.6 * k + "px " + SANS, ital = "500 " + 8.6 * k + "px " + SANS;
      var runs = [
        { text: "Start with: ", font: plain, color: "#000000" },
        { text: curly(a.start), font: ital, color: "#000000" },
        { text: ".", font: plain, color: "#000000" }
      ];
      if (a.then) runs.push(
        { text: " Then try: ", font: plain, color: "#000000" },
        { text: curly(a.then), font: ital, color: "#000000" },
        { text: ".", font: plain, color: "#000000" }
      );
      drawRuns(ctx, M + pad, cy, runs);
      y += h + 7 * k;
    });
    if (L.also.length) {
      y += 6 * k;
      ctx.font = bodyFont; ctx.fillStyle = "#000000";
      wrapLines(ctx, alsoLine(sc, L), CW).forEach(function (l) { ctx.fillText(l, M, y); y += lh; });
    }

    // Safety line
    if (L.safety) {
      y += 12 * k;
      ctx.font = "400 " + 7.8 * k + "px " + SANS; ctx.fillStyle = "#000000"; ctx.textAlign = "center";
      wrapLines(ctx, COPY.safety, CW * 0.75).forEach(function (l) { ctx.fillText(l, PW / 2, y); y += 11 * k; });
      ctx.textAlign = "left";
    }

    // Closing line
    y += 12 * k;
    ctx.font = "400 " + 11 * k + "px " + SANS; ctx.fillStyle = "#000000"; ctx.textAlign = "center";
    wrapLines(ctx, curly(COPY.closing), CW * 0.8).forEach(function (l) { ctx.fillText(l, PW / 2, y); y += 17 * k; });
    ctx.textAlign = "left";
    return y;
  }

  function line(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  function drawRadarCanvas(ctx, cx, cy, r, scores, prev, k) {
    function p(i, v, rr) {
      var a = (Math.PI * 2 * i) / 8 - Math.PI / 2, d = (v / 10) * (rr || r);
      return [cx + d * Math.cos(a), cy + d * Math.sin(a)];
    }
    function path(vals, rr) {
      ctx.beginPath();
      vals.forEach(function (v, i) { var q = p(i, v, rr); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
      ctx.closePath();
    }
    ctx.strokeStyle = "#FBBECA";
    for (var l = 2; l <= 10; l += 2) { ctx.lineWidth = l === 10 ? 0.8 : 0.5; path([l, l, l, l, l, l, l, l]); ctx.stroke(); }
    ctx.lineWidth = 0.5;
    for (var j = 0; j < 8; j++) { var e = p(j, 10); line(ctx, cx, cy, e[0], e[1]); }
    if (prev) {
      ctx.setLineDash([2.5, 2.5]); ctx.strokeStyle = "#FC889B"; ctx.lineWidth = 1;
      path(prev); ctx.stroke(); ctx.setLineDash([]);
    }
    path(scores);
    ctx.fillStyle = "rgba(167,185,160,0.6)"; ctx.fill();
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.3; ctx.lineJoin = "round"; ctx.stroke();
    scores.forEach(function (v, i) {
      var q = p(i, v);
      ctx.beginPath(); ctx.arc(q[0], q[1], 2.4, 0, Math.PI * 2);
      ctx.fillStyle = "#000000"; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = "#FFF7F7"; ctx.stroke();
    });
    AREAS.forEach(function (a, i) {
      var q = p(i, 10, r + 11 * k);
      ctx.textAlign = q[0] < cx - 5 ? "right" : q[0] > cx + 5 ? "left" : "center";
      var top = q[1] < cy - r, bottom = q[1] > cy + r;
      var oy = top ? -12 * k : bottom ? 8 * k : (q[1] < cy - 5 ? -6 * k : q[1] > cy + 5 ? 2 * k : -3 * k);
      ctx.font = "400 " + 7.6 * k + "px " + SANS; ctx.fillStyle = "#000000";
      ctx.fillText(a.name, q[0], q[1] + oy);
      ctx.font = "800 " + 11 * k + "px " + SERIF; ctx.fillStyle = "#000000";
      ctx.fillText(String(scores[i]), q[0], q[1] + oy + 11 * k);
    });
    ctx.textAlign = "left";
  }

  function buildPDF(jpegBytes, imgW, imgH) {
    var enc = new TextEncoder();
    var chunks = [], offsets = [], length = 0;
    function add(part) {
      var b = typeof part === "string" ? enc.encode(part) : part;
      chunks.push(b); length += b.length;
    }
    function obj(n, body) { offsets[n] = length; add(n + " 0 obj\n" + body + "\nendobj\n"); }
    var content = "q\n" + PW + " 0 0 " + PH + " 0 0 cm\n/Im0 Do\nQ\n";

    add("%PDF-1.4\n%âãÏÓ\n");
    obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
    obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
    obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
    offsets[4] = length;
    add("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + imgW + " /Height " + imgH +
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpegBytes.length + " >>\nstream\n");
    add(jpegBytes);
    add("\nendstream\nendobj\n");
    obj(5, "<< /Length " + content.length + " >>\nstream\n" + content + "endstream");
    obj(6, "<< /Title (" + COPY.resultsTitle + ") /Producer (Energy Detective) >>");
    var xref = length;
    var x = "xref\n0 7\n0000000000 65535 f \n";
    for (var i = 1; i <= 6; i++) x += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
    add(x + "trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
    return new Blob(chunks, { type: "application/pdf" });
  }

  function savePDF() {
    var btn = document.getElementById("rw-save");
    btn.disabled = true;
    loadFonts().then(function () {
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(PW * PX);
      canvas.height = Math.round(PH * PX);
      var ctx = canvas.getContext("2d");
      var k = 1;
      for (var tries = 0; tries < 10; tries++) {
        var bottom = drawPage(ctx, k);
        if (bottom <= PH - 34) break;
        k *= 0.93;
      }
      var dataURL = canvas.toDataURL("image/jpeg", 0.92);
      var bin = atob(dataURL.split(",")[1]);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = buildPDF(bytes, canvas.width, canvas.height);
      var url = URL.createObjectURL(blob);
      var stamp = (state.date || new Date().toISOString()).slice(0, 10);
      var a = document.createElement("a");
      a.href = url;
      a.download = "Relationship-Wheel-" + stamp + ".pdf";
      if (typeof a.download === "undefined") window.open(url, "_blank");
      else { document.body.appendChild(a); a.click(); document.body.removeChild(a); }
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }).catch(function (e) {
      if (window.console) console.error(e);
    }).then(function () {
      btn.disabled = false;
    });
  }

  renderWelcome();
})();
</script>
