<style>
  :root{
    --cream:#f5f2ec; --charcoal:#242220; --gold:#b89a6a; --sage:#a7b9a0; --sand:#d8cbb7; --forest:#4a5a4f;
    --ink:#424242; --hair:rgba(66,66,66,.14);
    --disp:'Instrument Serif',Georgia,serif; --sans:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6}

  .col{max-width:440px;margin:0 auto;padding:0 24px}

  /* ---- hero: full-bleed charcoal band, mirrors the site's dark hero convention ---- */
  .hero{background:var(--charcoal);padding:38px 0 30px;text-align:center}
  .avatar-ring{width:84px;height:84px;border-radius:50%;padding:4px;background:var(--gold);margin:0 auto 16px}
  .avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

  .eyebrow{font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
  h1{font-family:var(--disp);font-weight:400;font-size:29px;margin:0 0 14px;color:var(--cream)}
  h1 em{font-style:italic;color:var(--gold)}

  .bio{font-size:14px;font-weight:400;line-height:1.6;color:color-mix(in srgb,var(--cream) 84%,transparent);margin:0}
  .bio span{display:block}

  .rowlist{border-top:1px solid var(--hair);margin:30px 0 24px}

  /* numbered row — lifted from the homepage's .hwrow treatment: oldstyle gold numeral + serif title.
     Padding kept at/above the 44px thumb-target minimum even with a single line of text. */
  .r{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;width:100%;min-height:44px;
     padding:17px 4px;border-bottom:1px solid var(--hair);border-top:none;border-left:none;border-right:none;background:none;
     text-decoration:none;color:inherit;font:inherit;text-align:left;cursor:pointer;
     -webkit-tap-highlight-color:transparent;transition:background .2s}
  .r:active,.r:hover{background:color-mix(in srgb,var(--gold) 6%,transparent)}
  .num{font-family:var(--disp);font-weight:300;font-size:32px;line-height:1;color:var(--gold);font-variant-numeric:oldstyle-nums}
  .r .txt{min-width:0}
  .r .rt{display:block;font-family:var(--disp);font-weight:400;font-size:19px;color:var(--charcoal)}
  .r .arrow{flex:0 0 auto;color:var(--gold);font-size:18px;font-family:var(--disp);transition:transform .2s}
  .r:hover .arrow{transform:translateX(3px)}
  .r .arrow.yt-icon{display:flex}
  .r .arrow.yt-icon svg{width:26px;height:26px;fill:var(--gold)}
  .r:hover .arrow.yt-icon{transform:none}

  .icons{display:flex;justify-content:center;margin-bottom:28px}
  .icon-link{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;transition:background .2s,transform .18s cubic-bezier(.22,1,.36,1)}
  .icon-link:active{transform:scale(.93)}
  .icon-link:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
  .icon-link svg{width:19px;height:19px;fill:var(--charcoal)}

  footer{padding:0 0 28px;text-align:center}
  .foot-copy{font-size:11px;letter-spacing:.02em;color:color-mix(in srgb,var(--ink) 60%,transparent);margin:0}
  .foot-copy a{color:inherit}

  /* ---- video pop-out modal ---- */
  .modal-scrim{position:fixed;inset:0;z-index:100;background:rgba(36,34,32,.92);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .modal-scrim.open{opacity:1;pointer-events:auto}
  .modal-box{width:100%;max-width:560px;position:relative}
  .modal-close{position:absolute;top:-40px;right:0;width:32px;height:32px;border:1px solid rgba(245,242,236,.4);border-radius:50%;background:none;color:var(--cream);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
  .modal-close:hover{background:rgba(245,242,236,.1)}
  .modal-frame{width:100%;aspect-ratio:16/9;background:var(--charcoal);border-radius:4px;overflow:hidden}
  .modal-frame iframe{width:100%;height:100%;border:0;display:block}
</style>

<script>
(function(){
  var openBtn = document.getElementById('ytOpen');
  var closeBtn = document.getElementById('ytClose');
  var scrim = document.getElementById('ytScrim');
  var frame = document.getElementById('ytFrame');

  function openModal(){
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/HPTnU_fCsLY?autoplay=1&rel=0';
    iframe.title = 'Nicky Williams interview with Emma V';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    frame.innerHTML = '';
    frame.appendChild(iframe);
    scrim.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){
    scrim.classList.remove('open');
    document.body.style.overflow = '';
    frame.innerHTML = '';
  }
  openBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  scrim.addEventListener('click', function(e){ if (e.target === scrim) closeModal(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
})();
</script>
